        <publisher>Veterinaria Zoovet Travel · Calle Cuba 241, Trujillo, La Libertad, Peru · zoovettravel.com</publisher>
        <description>Bar chart comparing FAVN rabies antibody titres in ATON (Weimaraner, microchip 725093200213835): initial failure 0.22 IU/mL (R26-013079, Feb 4 2026) vs. post-reconversion ≥3.46 IU/mL (R26-030347, Apr 4 2026) after Novibac Rabies D1/D15/D30 protocol. Delta 15.73×. Highest reconversion delta in Zoovet Travel FAVN dataset (49 records, 2019–2026). DOI dataset: 10.5281/zenodo.20311995 · Source: zoovettravel.com</description>
        <subject>FAVN; rabies neutralizing antibody titer; KSVDL; primary vaccine failure; serological reconversion; 0.22 IU/mL; 3.46 IU/mL; Novibac Rabies; Weimaraner; EU threshold 0.50 IU/mL; WOAH; Jessica Camacho CMVP 12434; zoovettravel.com</subject>
        <date>2026</date>
        <identifier>https://zoovettravel.com · DOI: 10.5281/zenodo.20311995</identifier>
