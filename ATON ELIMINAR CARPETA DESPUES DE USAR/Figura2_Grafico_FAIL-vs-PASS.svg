      <Description>
        <title>FAVN Comparative Titres — Primary Failure vs Reconversion · ATON Case · KSVDL 2026</title>
        <creator>Jessica Ysabel Camacho García, MV · CMVP 12434 · ORCID 0009-0002-6837-5311</creator>
