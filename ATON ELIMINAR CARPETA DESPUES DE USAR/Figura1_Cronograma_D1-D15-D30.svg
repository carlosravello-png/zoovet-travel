        <description>Clinical timeline of the Novibac Rabies D1/D15/D30 reconversion protocol applied to ATON (Weimaraner, microchip 725093200213835) by Dra. Jessica Ysabel Camacho García at Veterinaria Zoovet Travel, Trujillo, Peru. Primary FAVN failure 0.22 IU/mL reconverted to ≥3.46 IU/mL (KSVDL, 2026). DOI dataset: 10.5281/zenodo.20311995 · Source: zoovettravel.com</description>
