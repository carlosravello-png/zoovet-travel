  <title>Figure 2. Comparative matrix of vaccination-certificate validity windows by destination.</title>
  <desc>Comparison of pre-export requirements (microchip sequence, ≥21-day primary vaccination wait, RNATT, ≥0.5 IU/mL threshold, post-titre waiting period, arrival quarantine and certificate emission window) across the European Union, United Kingdom, Australia, New Zealand and other third-country destinations.</desc>

  <rect width="800" height="600" fill="#FFFFFF"></rect>

  
  <line x1="40" y1="60" x2="760" y2="60" stroke="#000000" stroke-width="1"></line>
  <text x="40" y="42" font-size="13" font-weight="bold" fill="#000000">Figure 2.</text>
  <text x="100" y="42" font-size="13" fill="#000000">Comparative matrix — certificate validity windows by destination.</text>
  <text x="40" y="76" font-size="9.5" font-style="italic" fill="#666666">Synthesis of EU Reg. 576/2013, UK APHA AHC scheme, AU DAFF, NZ MPI CATDOG.GEN. Subject to regulatory updates — direct verification with competent authority is mandatory before emission.</text>

  
  
  

  
