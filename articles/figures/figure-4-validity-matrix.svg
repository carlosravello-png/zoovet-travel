    <text x="368" y="113" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">United Kingdom</text>
    <text x="368" y="125" font-size="9" font-style="italic" fill="#FFFFFF" text-anchor="middle">APHA — AHC</text>

