    <text x="480" y="113" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Australia</text>
    <text x="480" y="125" font-size="9" font-style="italic" fill="#FFFFFF" text-anchor="middle">DAFF</text>

    <rect x="536" y="95" width="112" height="36" fill="#1A5276" stroke="#000000" stroke-width="1"></rect>
    <text x="592" y="113" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">New Zealand</text>
    <text x="592" y="125" font-size="9" font-style="italic" fill="#FFFFFF" text-anchor="middle">MPI · CATDOG.GEN</text>

