  <line x1="232" y1="385" x2="285" y2="400" stroke="#000000" stroke-width="0.8"></line>
  <text x="290" y="403" font-size="9" fill="#000000" font-style="italic">Peru — non-listed</text>

  
  <g transform="translate(595,95)">
    <rect x="0" y="0" width="165" height="410" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"></rect>
    <text x="82" y="20" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">ORIGIN ZONES</text>
    <line x1="10" y1="28" x2="155" y2="28" stroke="#000000" stroke-width="0.6"></line>

    
    <rect x="10" y="40" width="20" height="14" fill="#1A5276" stroke="#000000" stroke-width="0.6"></rect>
    <text x="36" y="51" font-size="10" font-weight="bold" fill="#000000">EU + EEA</text>
    <text x="10" y="70" font-size="9" fill="#000000">Intra-community.</text>
    <text x="10" y="83" font-size="9" fill="#000000">EU Pet Passport,</text>
    <text x="10" y="96" font-size="9" fill="#000000">valid for life if</text>
    <text x="10" y="109" font-size="9" fill="#000000">rabies vax kept</text>
    <text x="10" y="122" font-size="9" fill="#000000">current.</text>

    <line x1="10" y1="138" x2="155" y2="138" stroke="#666666" stroke-width="0.4"></line>

    
    <rect x="10" y="148" width="20" height="14" fill="#666666" stroke="#000000" stroke-width="0.6"></rect>
    <text x="36" y="159" font-size="10" font-weight="bold" fill="#000000">Annex II Part 1</text>
    <text x="10" y="178" font-size="9" fill="#000000">Listed third</text>
    <text x="10" y="191" font-size="9" fill="#000000">countries with</text>
    <text x="10" y="204" font-size="9" fill="#000000">equivalent status.</text>
    <text x="10" y="221" font-size="9" fill="#000000">Microchip + valid</text>
    <text x="10" y="234" font-size="9" fill="#000000">rabies vax.</text>
    <text x="10" y="247" font-size="9" font-style="italic" fill="#666666">No RFFIT required.</text>

    <line x1="10" y1="260" x2="155" y2="260" stroke="#666666" stroke-width="0.4"></line>

    
    <rect x="10" y="270" width="20" height="14" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"></rect>
    <text x="36" y="281" font-size="10" font-weight="bold" fill="#000000">Part 2 / non-listed</text>
    <text x="10" y="300" font-size="9" fill="#000000">High-risk protocol:</text>
    <text x="10" y="313" font-size="9" fill="#000000">Microchip + vax</text>
    <text x="10" y="326" font-size="9" fill="#000000">+ RFFIT ≥ 0.5 IU/mL</text>
    <text x="10" y="339" font-size="9" fill="#000000">+ 3-month wait</text>
    <text x="10" y="352" font-size="9" fill="#000000">from sample date</text>
    <text x="10" y="365" font-size="9" fill="#000000">+ Annex IV</text>
    <text x="10" y="378" font-size="9" fill="#000000">official certificate.</text>
    <text x="10" y="395" font-size="9" font-style="italic" fill="#666666">Peru group.</text>
  </g>

  
  <line x1="40" y1="525" x2="760" y2="525" stroke="#000000" stroke-width="0.6"></line>
  <text x="40" y="545" font-size="9.5" fill="#000000" font-weight="bold">Note —</text>
  <text x="88" y="545" font-size="9.5" fill="#000000">No Peruvian laboratory holds EU approval for RFFIT; samples are routed to KSVDL (US), ANSES Nancy (FR) or FLI (DE).</text>
  <text x="40" y="560" font-size="9.5" fill="#666666" font-style="italic">Annex II is amended by the European Commission. Verify the current Annex II Part 1 list before each export.</text>

  
