  <title>Figure 1. Origin-zone categories under Regulation (EU) 576/2013.</title>
  <desc>Schematic categorical world map showing the three legal origin zones recognised by Regulation (EU) 576/2013: EU Member States and EEA (intra-community pet-passport regime), Annex II Part 1 listed third countries with equivalent status, and Annex II Part 2 listed / non-listed third countries subject to the high-risk protocol (RFFIT + 3-month wait). Peru is non-listed.</desc>

  <rect width="800" height="600" fill="#FFFFFF"></rect>

  
  <line x1="40" y1="60" x2="760" y2="60" stroke="#000000" stroke-width="1"></line>
  <text x="40" y="42" font-size="13" font-weight="bold" fill="#000000">Figure 1.</text>
  <text x="100" y="42" font-size="13" fill="#000000">Origin-zone categories under Regulation (EU) 576/2013.</text>
  <text x="40" y="76" font-size="9.5" font-style="italic" fill="#666666">Schematic categorical map; boundaries are illustrative, not cartographic. Source: Reg. (EU) 576/2013 Annex II, as amended by Implementing Reg. (EU) 577/2013 and subsequent acts.</text>

  
  <rect x="40" y="95" width="540" height="410" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"></rect>

  
  <g stroke="#666666" stroke-width="0.3" stroke-dasharray="2,3" opacity="0.4">
    <line x1="40" y1="200" x2="580" y2="200"></line>
    <line x1="40" y1="300" x2="580" y2="300"></line>
    <line x1="40" y1="400" x2="580" y2="400"></line>
    <line x1="175" y1="95" x2="175" y2="505"></line>
    <line x1="310" y1="95" x2="310" y2="505"></line>
    <line x1="445" y1="95" x2="445" y2="505"></line>
  </g>

  
  <path d="M 295,130 L 410,135 L 425,180 L 395,215 L 315,210 L 290,170 Z" fill="#1A5276" stroke="#000000" stroke-width="1"></path>
  <text x="357" y="172" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="bold">EU + EEA</text>
  <text x="357" y="186" font-size="8.5" text-anchor="middle" fill="#FFFFFF">intra-community</text>
  <text x="357" y="198" font-size="8.5" text-anchor="middle" fill="#FFFFFF">EU Pet Passport</text>

  
  
  <path d="M 90,205 L 230,205 L 235,250 L 100,255 Z" fill="#666666" stroke="#000000" stroke-width="0.9"></path>
  <text x="160" y="232" font-size="9" text-anchor="middle" fill="#FFFFFF">USA</text>
  
