  <text x="195" y="316" font-size="7.5" text-anchor="middle" fill="#000000">C. Am.</text>

  
  <path d="M 200,325 L 260,330 L 275,380 L 270,440 L 240,475 L 215,470 L 200,420 L 195,370 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"></path>
  
