  <text x="555" y="243" font-size="7.5" text-anchor="middle" fill="#FFFFFF">JP</text>
  
  <path d="M 480,380 L 555,375 L 565,415 L 510,425 L 480,410 Z" fill="#666666" stroke="#000000" stroke-width="0.9"></path>
