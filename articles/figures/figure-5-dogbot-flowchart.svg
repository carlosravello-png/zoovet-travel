  <title>Figure 1. Decision flowchart — DogBot classification under the 2024 CDC Interim Final Rule.</title>
  <desc>Branching decision tree showing how the CDC DogBot portal classifies a dog as compliant, conditional or non-compliant on the basis of microchip sequence, animal age, country risk class, RFFIT serology and APHIS Form 7001 endorsement window.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"></path>
    </marker>
    <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1A5276"></path>
    </marker>
  </defs>

  <rect width="600" height="800" fill="#FFFFFF"></rect>

  
  <line x1="40" y1="60" x2="560" y2="60" stroke="#000000" stroke-width="1"></line>
  <text x="40" y="42" font-size="13" font-weight="bold" fill="#000000">Figure 1.</text>
  <text x="100" y="42" font-size="13" fill="#000000">DogBot classification — CDC 2024 Interim Final Rule.</text>
  <text x="40" y="76" font-size="9.5" font-style="italic" fill="#666666">Sequential AND-logic; classification is automated by the dogs.cdc.gov portal prior to flight. Source: CDC IFR, 42 CFR Part 71 (effective 2024-08-01).</text>

  
  <rect x="200" y="92" width="200" height="32" fill="#1A5276" stroke="#000000" stroke-width="1"></rect>
  <text x="300" y="113" font-size="12" text-anchor="middle" fill="#FFFFFF" font-weight="bold">DOG presented for US entry</text>
  <line x1="300" y1="124" x2="300" y2="145" stroke="#000000" stroke-width="1.2" marker-end="url(#arr)"></line>

  
  <polygon points="300,150 410,195 300,240 190,195" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"></polygon>
  <text x="300" y="190" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">Dog ≥ 6 months old?</text>
  <text x="300" y="204" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">(high-risk origin)</text>
  <line x1="410" y1="195" x2="478" y2="195" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="444" y="189" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">NO</text>
  <line x1="300" y1="240" x2="300" y2="270" stroke="#1A5276" stroke-width="1.4" marker-end="url(#arrAcc)"></line>
  <text x="312" y="260" font-size="10" fill="#1A5276" font-weight="bold">YES</text>

  
  <polygon points="300,275 410,320 300,365 190,320" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"></polygon>
  <text x="300" y="315" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">ISO microchip implanted</text>
  <text x="300" y="329" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">BEFORE rabies vaccine?</text>
  <line x1="410" y1="320" x2="478" y2="320" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="444" y="314" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">NO</text>
  <line x1="300" y1="365" x2="300" y2="395" stroke="#1A5276" stroke-width="1.4" marker-end="url(#arrAcc)"></line>
  <text x="312" y="385" font-size="10" fill="#1A5276" font-weight="bold">YES</text>

  
  <polygon points="300,400 415,448 300,496 185,448" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"></polygon>
  <text x="300" y="442" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">High-risk country</text>
  <text x="300" y="456" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">of origin?</text>
  <text x="300" y="470" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">(e.g., Peru — list at CDC)</text>
  
  <line x1="185" y1="448" x2="100" y2="448" stroke="#000000" stroke-width="1"></line>
  <line x1="100" y1="448" x2="100" y2="600" stroke="#000000" stroke-width="1"></line>
  <line x1="100" y1="600" x2="160" y2="600" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="142" y="441" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">NO</text>
  
  <line x1="300" y1="496" x2="300" y2="525" stroke="#1A5276" stroke-width="1.4" marker-end="url(#arrAcc)"></line>
  <text x="312" y="516" font-size="10" fill="#1A5276" font-weight="bold">YES</text>

  
  <polygon points="300,530 420,580 300,630 180,580" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"></polygon>
  <text x="300" y="570" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">RFFIT ≥ 0.5 IU/mL,</text>
  <text x="300" y="584" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">sample ≥ 30 d post-vax,</text>
  <text x="300" y="598" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">USDA-approved lab?</text>
  <line x1="420" y1="580" x2="478" y2="580" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="448" y="574" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">NO</text>
  <line x1="300" y1="630" x2="300" y2="650" stroke="#1A5276" stroke-width="1.4"></line>

  
  <rect x="160" y="650" width="280" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"></rect>
  <text x="300" y="668" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">APHIS Form 7001 endorsement</text>
  <text x="300" y="684" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">≤ 10 d AND DogBot complete?</text>
  
  <line x1="440" y1="672" x2="478" y2="672" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="458" y="666" font-size="9.5" text-anchor="middle" fill="#000000" font-weight="bold">NO</text>
  
  <line x1="300" y1="694" x2="300" y2="715" stroke="#1A5276" stroke-width="1.6" marker-end="url(#arrAcc)"></line>
  <text x="312" y="710" font-size="10" fill="#1A5276" font-weight="bold">YES</text>

  
  <rect x="160" y="720" width="280" height="38" fill="#1A5276" stroke="#000000" stroke-width="1"></rect>
  <text x="300" y="744" font-size="13" text-anchor="middle" fill="#FFFFFF" font-weight="bold">COMPLIANT — direct entry</text>

  
  <rect x="478" y="565" width="100" height="115" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"></rect>
  <text x="528" y="586" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">CONDITIONAL</text>
  <line x1="488" y1="594" x2="568" y2="594" stroke="#000000" stroke-width="0.6"></line>
  <text x="528" y="612" font-size="9" text-anchor="middle" fill="#000000">Port-of-entry</text>
  <text x="528" y="624" font-size="9" text-anchor="middle" fill="#000000">inspection;</text>
  <text x="528" y="640" font-size="9" text-anchor="middle" fill="#000000">may proceed</text>
  <text x="528" y="652" font-size="9" text-anchor="middle" fill="#000000">if defect</text>
  <text x="528" y="664" font-size="9" text-anchor="middle" fill="#000000">remediable.</text>

  
  <rect x="478" y="170" width="100" height="380" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"></rect>
  <text x="528" y="194" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">NON-COMPLIANT</text>
  <line x1="488" y1="202" x2="568" y2="202" stroke="#000000" stroke-width="0.6"></line>
  <text x="528" y="222" font-size="9" text-anchor="middle" fill="#000000">Entry denied</text>
  <text x="528" y="234" font-size="9" text-anchor="middle" fill="#000000">or animal held.</text>
  <text x="528" y="258" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">Triggers (any):</text>
  <text x="528" y="278" font-size="9" text-anchor="middle" fill="#000000">• Age &lt; 6 mo</text>
  <text x="528" y="292" font-size="9" text-anchor="middle" fill="#000000">  from high-risk</text>
  <text x="528" y="312" font-size="9" text-anchor="middle" fill="#000000">• Chip after</text>
  <text x="528" y="326" font-size="9" text-anchor="middle" fill="#000000">  vaccine</text>
  <text x="528" y="346" font-size="9" text-anchor="middle" fill="#000000">• RFFIT lab</text>
  <text x="528" y="360" font-size="9" text-anchor="middle" fill="#000000">  not approved</text>
  <text x="528" y="380" font-size="9" text-anchor="middle" fill="#000000">• Titre &lt; 0.5</text>
  <text x="528" y="394" font-size="9" text-anchor="middle" fill="#000000">  IU/mL</text>
  <text x="528" y="414" font-size="9" text-anchor="middle" fill="#000000">• Sample &lt; 30 d</text>
  <text x="528" y="428" font-size="9" text-anchor="middle" fill="#000000">  post-vaccine</text>
  <text x="528" y="452" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">Outcome:</text>
  <text x="528" y="472" font-size="9" text-anchor="middle" fill="#000000">protocol restart</text>
  <text x="528" y="484" font-size="9" text-anchor="middle" fill="#000000">or return</text>
  <text x="528" y="496" font-size="9" text-anchor="middle" fill="#000000">shipment.</text>

  
  <text x="560" y="788" font-size="8" fill="#666666" text-anchor="end">© Jessica Y. Camacho Garcia, MVZ — CMVP 12434 | Zoovet Travel — Technical Series Vol. XIII | zoovettravel.com | 2026</text>
</svg>