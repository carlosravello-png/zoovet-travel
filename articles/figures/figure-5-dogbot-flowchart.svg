        <dc:subject>CDC DogBot; dog importation USA 2024; Interim Final Rule; RFFIT; APHIS Form 7001; high-risk country</dc:subject>
        <dc:relation>https://zoovettravel.com/articles/zoovet_art13_cdc-dmrvv-ES.html</dc:relation>
