<title>RFFIT vs FAVN methodological comparison — Rabies virus neutralization tests</title>
<desc>Seven-step methodological comparison of RFFIT (Smith, Yager &amp; Baer 1973) and FAVN (Cliquet, Aubert &amp; Sagné 1998), with WOAH-recognized equivalence. Authors: Camacho García JY, Camacho Paz VJ. Source: zoovettravel.com</desc>

      <title>RFFIT vs FAVN methodological comparison</title>
      <rect width="960" height="720" fill="#ffffff"></rect>

      
      <text x="40" y="38" font-size="17" font-weight="700">
        RFFIT vs FAVN · WOAH-recognized methodological equivalence
      </text>
      <text x="40" y="58" font-size="12" fill="#6b7280">
        Both tests measure neutralizing antibodies (rVNA) in IU/mL against the WHO reference serum
      </text>

      
      <rect x="60" y="90" width="400" height="60" fill="#e8eef6" stroke="#2c5282" stroke-width="1.4"></rect>
      <text x="260" y="115" font-size="18" font-weight="700" text-anchor="middle" fill="#2c5282">RFFIT</text>
      <text x="260" y="135" font-size="11" text-anchor="middle" fill="#444">
        Rapid Fluorescent Focus Inhibition Test · Smith, Yager &amp; Baer (1973)
      </text>

      <rect x="500" y="90" width="400" height="60" fill="#f8ecda" stroke="#b94a2c" stroke-width="1.4"></rect>
      <text x="700" y="115" font-size="18" font-weight="700" text-anchor="middle" fill="#b94a2c">FAVN</text>
      <text x="700" y="135" font-size="11" text-anchor="middle" fill="#444">
        Fluorescent Antibody Virus Neutralization · Cliquet, Aubert &amp; Sagné (1998)
      </text>

      
      
      <g font-size="11">
        
        <rect x="60" y="170" width="400" height="50" fill="#ffffff" stroke="#d8d3c8"></rect>
        <rect x="500" y="170" width="400" height="50" fill="#ffffff" stroke="#d8d3c8"></rect>
        <circle cx="80" cy="195" r="11" fill="#2c5282"></circle><text x="80" y="199" text-anchor="middle" fill="#fff" font-weight="700" font-size="11">1</text>
        <circle cx="520" cy="195" r="11" fill="#b94a2c"></circle><text x="520" y="199" text-anchor="middle" fill="#fff" font-weight="700" font-size="11">1</text>
        <text x="100" y="193" font-weight="600">Serial dilution of serum</text>
        <text x="100" y="209" fill="#666">Microplate + WHO reference serum</text>
        <text x="540" y="193" font-weight="600">Serial dilution of serum</text>
        <text x="540" y="209" fill="#666">96-well microplate · high throughput</text>

        
        <rect x="60" y="226" width="400" height="50" fill="#fafaf7" stroke="#d8d3c8"></rect>
        <rect x="500" y="226" width="400" height="50" fill="#fafaf7" stroke="#d8d3c8"></rect>
        <circle cx="80" cy="251" r="11" fill="#2c5282"></circle><text x="80" y="255" text-anchor="middle" fill="#fff" font-weight="700" font-size="11">2</text>
        <circle cx="520" cy="251" r="11" fill="#b94a2c"></circle><text x="520" y="255" text-anchor="middle" fill="#fff" font-weight="700" font-size="11">2</text>
        <text x="100" y="249" font-weight="600">Challenge virus addition</text>
        <text x="100" y="265" fill="#666">Fixed dose of CVS-11 (live RABV)</text>
        <text x="540" y="249" font-weight="600">Challenge virus addition</text>
        <text x="540" y="265" fill="#666">Fixed dose of CVS-11 (live RABV)</text>

        
        <rect x="60" y="282" width="400" height="50" fill="#ffffff" stroke="#d8d3c8"></rect>
        <rect x="500" y="282" width="400" height="50" fill="#ffffff" stroke="#d8d3c8"></rect>
        <circle cx="80" cy="307" r="11" fill="#2c5282"></circle><text x="80" y="311" text-anchor="middle" fill="#fff" font-weight="700" font-size="11">3</text>
        <circle cx="520" cy="307" r="11" fill="#b94a2c"></circle><text x="520" y="311" text-anchor="middle" fill="#fff" font-weight="700" font-size="11">3</text>
        <text x="100" y="305" font-weight="600">Antibody–virus incubation</text>
        <text x="100" y="321" fill="#666">Neutralization phase</text>
        <text x="540" y="305" font-weight="600">Antibody–virus incubation</text>
        <text x="540" y="321" fill="#666">Neutralization phase</text>

        
        <rect x="60" y="338" width="400" height="50" fill="#e8eef6" stroke="#2c5282" stroke-width="1.4"></rect>
        <rect x="500" y="338" width="400" height="50" fill="#f8ecda" stroke="#b94a2c" stroke-width="1.4"></rect>
        <circle cx="80" cy="363" r="11" fill="#2c5282"></circle><text x="80" y="367" text-anchor="middle" fill="#fff" font-weight="700" font-size="11">4</text>
        <circle cx="520" cy="363" r="11" fill="#b94a2c"></circle><text x="520" y="367" text-anchor="middle" fill="#fff" font-weight="700" font-size="11">4</text>
        <text x="100" y="361" font-weight="700" fill="#2c5282">Cell line: MNA (neuroblastoma)</text>
        <text x="100" y="377" fill="#444">Murine neuroblastoma, original cell type</text>
        <text x="540" y="361" font-weight="700" fill="#b94a2c">Cell line: BHK-21 (hamster kidney)</text>
        <text x="540" y="377" fill="#444">CNEVA Nancy protocol — adaptations exist</text>

        
        <rect x="60" y="394" width="400" height="50" fill="#fafaf7" stroke="#d8d3c8"></rect>
        <rect x="500" y="394" width="400" height="50" fill="#fafaf7" stroke="#d8d3c8"></rect>
        <circle cx="80" cy="419" r="11" fill="#2c5282"></circle><text x="80" y="423" text-anchor="middle" fill="#fff" font-weight="700" font-size="11">5</text>
        <circle cx="520" cy="419" r="11" fill="#b94a2c"></circle><text x="520" y="423" text-anchor="middle" fill="#fff" font-weight="700" font-size="11">5</text>
        <text x="100" y="417" font-weight="600">Fixation + FITC staining</text>
        <text x="100" y="433" fill="#666">Anti-nucleoprotein FITC-conjugated</text>
        <text x="540" y="417" font-weight="600">Fixation + FITC staining</text>
        <text x="540" y="433" fill="#666">Anti-nucleoprotein FITC-conjugated</text>

        
        <rect x="60" y="450" width="400" height="50" fill="#ffffff" stroke="#d8d3c8"></rect>
        <rect x="500" y="450" width="400" height="50" fill="#ffffff" stroke="#d8d3c8"></rect>
        <circle cx="80" cy="475" r="11" fill="#2c5282"></circle><text x="80" y="479" text-anchor="middle" fill="#fff" font-weight="700" font-size="11">6</text>
        <circle cx="520" cy="475" r="11" fill="#b94a2c"></circle><text x="520" y="479" text-anchor="middle" fill="#fff" font-weight="700" font-size="11">6</text>
        <text x="100" y="473" font-weight="600">Fluorescence microscopy reading</text>
        <text x="100" y="489" fill="#666">Infected focus count</text>
        <text x="540" y="473" font-weight="600">Fluorescence microscopy reading</text>
        <text x="540" y="489" fill="#666">Infected focus count</text>

        
        <rect x="60" y="506" width="400" height="50" fill="#fafaf7" stroke="#d8d3c8"></rect>
        <rect x="500" y="506" width="400" height="50" fill="#fafaf7" stroke="#d8d3c8"></rect>
        <circle cx="80" cy="531" r="11" fill="#2c5282"></circle><text x="80" y="535" text-anchor="middle" fill="#fff" font-weight="700" font-size="11">7</text>
        <circle cx="520" cy="531" r="11" fill="#b94a2c"></circle><text x="520" y="535" text-anchor="middle" fill="#fff" font-weight="700" font-size="11">7</text>
        <text x="100" y="529" font-weight="600">Titre calculation (Reed–Muench)</text>
        <text x="100" y="545" fill="#666">Result in IU/mL · threshold ≥ 0.5</text>
        <text x="540" y="529" font-weight="600">Titre calculation (Reed–Muench)</text>
        <text x="540" y="545" fill="#666">Result in IU/mL · threshold ≥ 0.5</text>
      </g>

      
      <rect x="60" y="582" width="840" height="76" fill="#e6efe9" stroke="#2f6b4e" stroke-width="1.4" rx="2"></rect>
      <text x="480" y="608" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6b4e">
        RECOGNIZED REGULATORY EQUIVALENCE
      </text>
      <text x="480" y="628" text-anchor="middle" font-size="11.5" fill="#1a1a1a">
        WOAH · WHO · EU Reg. 576/2013 · CDC/USDA · DAFF (AU) · MPI (NZ) · MAFF (JP)
      </text>
      <text x="480" y="646" text-anchor="middle" font-size="10.5" fill="#444" font-style="italic">
        Briggs et al. 1998: no significant differences in sensitivity or specificity between RFFIT and FAVN
      </text>

      
      <line x1="40" y1="678" x2="920" y2="678" stroke="#d8d3c8" stroke-width="0.8"></line>
      <text x="40" y="694" font-size="9.5" fill="#6b7280">
        Sources: Smith, Yager &amp; Baer 1973 · Cliquet, Aubert &amp; Sagné 1998 · Briggs et al. 1998 · Wasniewski et al. 2019 (ANSES-EURL) · WOAH Terrestrial Manual 2024
      </text>
      <text x="40" y="708" font-size="9.5" fill="#6b7280">Camacho García JY · Camacho Paz VJ · CC BY-SA 4.0 · zoovettravel.com · jessica-camacho.com</text>
    
</svg>