<title>The 0.5 IU/mL threshold as operational correlate of rabies protection</title>
<desc>Conceptual diagram of the WOAH/WHO regulatory threshold of 0.5 IU/mL with interpretive nuances. Authors: Camacho García JY, Camacho Paz VJ. Source: zoovettravel.com</desc>

      <title>0.5 IU/mL threshold as operational correlate of protection</title>
      <rect width="960" height="540" fill="#ffffff"></rect>

      
      <text x="40" y="38" font-size="17" font-weight="700">
        The 0.5 IU/mL threshold · Operational correlate of rabies protection
      </text>
      <text x="40" y="58" font-size="12" fill="#6b7280">
        Regulatory decision criterion — not a binary guarantee of individual sterilizing immunity
      </text>

      
      
      <rect x="80" y="170" width="280" height="60" fill="#f8ecda" stroke="#b94a2c" stroke-width="1.4"></rect>
      <text x="220" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#b94a2c">
        &lt; 0.5 IU/mL
      </text>
      <text x="220" y="218" text-anchor="middle" font-size="11" fill="#444">
        Regulatory failure · Export not authorized
      </text>

      
      <rect x="358" y="160" width="44" height="80" fill="#1a1a1a"></rect>
      <text x="380" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">0,5</text>
      <text x="380" y="216" text-anchor="middle" font-size="9" fill="#fff">UI/mL</text>

      
      <rect x="400" y="170" width="480" height="60" fill="#e6efe9" stroke="#2f6b4e" stroke-width="1.4"></rect>
      <text x="640" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6b4e">
        ≥ 0.5 IU/mL
      </text>
      <text x="640" y="218" text-anchor="middle" font-size="11" fill="#444">
        Adequate serological response · Export authorized
      </text>

      
      <line x1="220" y1="230" x2="220" y2="278" stroke="#b94a2c" stroke-width="1.2" stroke-dasharray="3 3"></line>
      <line x1="640" y1="230" x2="640" y2="278" stroke="#2f6b4e" stroke-width="1.2" stroke-dasharray="3 3"></line>

      
      <rect x="80" y="280" width="280" height="138" fill="#ffffff" stroke="#b94a2c" stroke-width="1.2"></rect>
      <text x="96" y="304" font-size="11" font-weight="700" fill="#b94a2c" letter-spacing="0.5">
        IMPORTANT — INTERPRETATION
      </text>
      <text x="96" y="325" font-size="12" font-weight="700">
        Does not equal &#34;unprotected&#34;
      </text>
      <text x="96" y="346" font-size="11" fill="#444">Cellular immunity (T lymphocytes,</text>
      <text x="96" y="362" font-size="11" fill="#444">memory B) may contribute to</text>
      <text x="96" y="378" font-size="11" fill="#444">resistance without showing in VNT.</text>
      <text x="96" y="400" font-size="11" fill="#444" font-style="italic">Possible causes: primary vaccine failure,</text>
      <text x="96" y="412" font-size="11" fill="#444" font-style="italic">age, breed, nutrition, vaccine batch.</text>

      
      <rect x="520" y="280" width="360" height="138" fill="#ffffff" stroke="#2f6b4e" stroke-width="1.2"></rect>
      <text x="536" y="304" font-size="11" font-weight="700" fill="#2f6b4e" letter-spacing="0.5">
        IMPORTANT — INTERPRETATION
      </text>
      <text x="536" y="325" font-size="12" font-weight="700">
        Not guaranteed sterilizing immunity
      </text>
      <text x="536" y="346" font-size="11" fill="#444">It is a population-level correlate</text>
      <text x="536" y="362" font-size="11" fill="#444">derived from challenge studies and</text>
      <text x="536" y="378" font-size="11" fill="#444">vaccine efficacy — not of each individual.</text>
      <text x="536" y="400" font-size="11" fill="#444" font-style="italic">It enables objective regulatory decision</text>
      <text x="536" y="412" font-size="11" fill="#444" font-style="italic">and international comparability.</text>

      
      <rect x="80" y="438" width="800" height="60" fill="#f3f0eb" stroke="#1a1a1a" stroke-width="1.2"></rect>
      <text x="480" y="461" text-anchor="middle" font-size="12" font-weight="700">
        INTERNATIONAL COMPARABILITY BASE
      </text>
      <text x="480" y="481" text-anchor="middle" font-size="11" fill="#333">
        WHO reference serum · ISO 17025 laboratories · Annual ANSES-EURL proficiency tests
      </text>

      
      <line x1="40" y1="510" x2="920" y2="510" stroke="#d8d3c8" stroke-width="0.8"></line>
      <text x="40" y="524" font-size="9.5" fill="#6b7280">
        Sources: Moore &amp; Hanlon 2010 · Briggs et al. 1998 · WOAH Terrestrial Code 2024 · Wasniewski et al. 2019 · Camacho García JY · Camacho Paz VJ · CC BY-SA 4.0 · zoovettravel.com · jessica-camacho.com
      </text>
    
</svg>