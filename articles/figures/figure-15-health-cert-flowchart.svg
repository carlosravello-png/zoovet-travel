  <title>Figure 1. Health-certificate validity by destination — decision flowchart.</title>
  <desc>Sequential branching flowchart establishing whether an international health certificate is accepted at the destination border, integrating five gating conditions: clinical examination performed, certificate within destination-specific temporal window, emitting veterinarian holds the required credentials, official endorsement obtained where required, and dossier-wide coherence with the microchip identifier.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"></path>
    </marker>
    <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1A5276"></path>
    </marker>
  </defs>

  <rect width="600" height="800" fill="#FFFFFF"></rect>

  
  <line x1="40" y1="60" x2="560" y2="60" stroke="#000000" stroke-width="1"></line>
  <text x="40" y="42" font-size="13" font-weight="bold" fill="#000000">Figure 1.</text>
  <text x="100" y="42" font-size="13" fill="#000000">Health-certificate validity at destination — decision flowchart.</text>
  <text x="40" y="76" font-size="9.5" font-style="italic" fill="#666666">All five conditions are conjunctive (AND-logic). The exact temporal window and endorsement requirement depend on the destination and must be verified with its competent authority at the time of emission.</text>

  
  <rect x="200" y="92" width="200" height="32" fill="#1A5276" stroke="#000000" stroke-width="1"></rect>
  <text x="300" y="113" font-size="12" text-anchor="middle" fill="#FFFFFF" font-weight="bold">HEALTH CERTIFICATE issued</text>
  <line x1="300" y1="124" x2="300" y2="142" stroke="#000000" stroke-width="1.2" marker-end="url(#arr)"></line>

  
  <polygon points="300,148 410,193 300,238 190,193" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"></polygon>
  <text x="300" y="186" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">Real clinical exam performed</text>
  <text x="300" y="200" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">and documented?</text>
  <line x1="410" y1="193" x2="478" y2="193" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="444" y="187" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">NO</text>
  <line x1="300" y1="238" x2="300" y2="265" stroke="#1A5276" stroke-width="1.4" marker-end="url(#arrAcc)"></line>
  <text x="312" y="258" font-size="10" fill="#1A5276" font-weight="bold">YES</text>

  
  <polygon points="300,270 415,318 300,366 185,318" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"></polygon>
  <text x="300" y="308" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">Within destination-specific</text>
  <text x="300" y="322" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">temporal window?</text>
  <text x="300" y="338" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">(typ. 24 h – 10 d; verify)</text>
  <line x1="415" y1="318" x2="478" y2="318" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="450" y="312" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">NO</text>
  <line x1="300" y1="366" x2="300" y2="390" stroke="#1A5276" stroke-width="1.4" marker-end="url(#arrAcc)"></line>
  <text x="312" y="384" font-size="10" fill="#1A5276" font-weight="bold">YES</text>

  
  <polygon points="300,395 415,443 300,491 185,443" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"></polygon>
  <text x="300" y="433" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">Emitting veterinarian holds</text>
  <text x="300" y="447" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">required credentials?</text>
  <text x="300" y="463" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">(private vet · official vet · OV)</text>
  <line x1="415" y1="443" x2="478" y2="443" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="450" y="437" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">NO</text>
  <line x1="300" y1="491" x2="300" y2="515" stroke="#1A5276" stroke-width="1.4" marker-end="url(#arrAcc)"></line>
  <text x="312" y="509" font-size="10" fill="#1A5276" font-weight="bold">YES</text>

  
  <polygon points="300,520 415,568 300,616 185,568" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"></polygon>
  <text x="300" y="558" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">Official endorsement obtained</text>
  <text x="300" y="572" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">where required?</text>
  <text x="300" y="588" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">(EU model; APHA OV; SENASA)</text>
  <line x1="415" y1="568" x2="478" y2="568" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="450" y="562" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">NO</text>
  <line x1="300" y1="616" x2="300" y2="640" stroke="#1A5276" stroke-width="1.4"></line>

  
  <rect x="160" y="640" width="280" height="50" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"></rect>
  <text x="300" y="660" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">Microchip exact &amp; identical across</text>
  <text x="300" y="674" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">all documents; dates coherent?</text>
  <text x="300" y="686" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">(ISO 15-digit + vax + RNATT + treatments)</text>
  <line x1="440" y1="668" x2="478" y2="668" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="458" y="662" font-size="9.5" text-anchor="middle" fill="#000000" font-weight="bold">NO</text>
  <line x1="300" y1="690" x2="300" y2="710" stroke="#1A5276" stroke-width="1.6" marker-end="url(#arrAcc)"></line>
  <text x="312" y="706" font-size="10" fill="#1A5276" font-weight="bold">YES</text>

  
  <rect x="120" y="715" width="360" height="38" fill="#1A5276" stroke="#000000" stroke-width="1"></rect>
  <text x="300" y="732" font-size="12" text-anchor="middle" fill="#FFFFFF" font-weight="bold">CERTIFICATE ACCEPTED AT BORDER</text>
  <text x="300" y="747" font-size="9.5" text-anchor="middle" fill="#FFFFFF" font-style="italic">subject to physical examination by border officer</text>

  
  <rect x="478" y="170" width="100" height="495" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"></rect>
  <text x="528" y="192" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">REJECTED</text>
  <line x1="488" y1="200" x2="568" y2="200" stroke="#000000" stroke-width="0.6"></line>
  <text x="528" y="220" font-size="9" text-anchor="middle" fill="#000000">Travel suspended;</text>
  <text x="528" y="232" font-size="9" text-anchor="middle" fill="#000000">new exam and / or</text>
  <text x="528" y="244" font-size="9" text-anchor="middle" fill="#000000">new endorsement</text>
  <text x="528" y="256" font-size="9" text-anchor="middle" fill="#000000">required.</text>
  <text x="528" y="280" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">Triggers:</text>
  <text x="528" y="300" font-size="9" text-anchor="middle" fill="#000000">• Exam not</text>
  <text x="528" y="312" font-size="9" text-anchor="middle" fill="#000000">  performed / dated</text>
  <text x="528" y="332" font-size="9" text-anchor="middle" fill="#000000">• Outside temporal</text>
  <text x="528" y="344" font-size="9" text-anchor="middle" fill="#000000">  window</text>
  <text x="528" y="364" font-size="9" text-anchor="middle" fill="#000000">• Wrong emitter:</text>
  <text x="528" y="376" font-size="9" text-anchor="middle" fill="#000000">  private vet where</text>
  <text x="528" y="388" font-size="9" text-anchor="middle" fill="#000000">  OV needed</text>
  <text x="528" y="408" font-size="9" text-anchor="middle" fill="#000000">• Missing endorse-</text>
  <text x="528" y="420" font-size="9" text-anchor="middle" fill="#000000">  ment / wrong model</text>
  <text x="528" y="440" font-size="9" text-anchor="middle" fill="#000000">• Microchip mismatch</text>
  <text x="528" y="452" font-size="9" text-anchor="middle" fill="#000000">  or date conflict</text>
  <text x="528" y="476" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">Reissue required;</text>
  <text x="528" y="488" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">may miss flight</text>
  <text x="528" y="500" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">if window short.</text>

  
  <text x="560" y="788" font-size="8" fill="#666666" text-anchor="end">© Jessica Y. Camacho Garcia, MVZ — CMVP 12434 | Zoovet Travel — Technical Series Vol. X | zoovettravel.com | 2026</text>
</svg>