  <title>Figure 1. UK pet importation regime — before and after Brexit (1 January 2021).</title>
  <desc>Split horizontal timeline comparing the pre-Brexit EU Pet Passport regime (governed by Regulation EU 576/2013 and applied across the UK by APHA) with the post-Brexit Animal Health Certificate (AHC) regime managed by APHA / DEFRA for Great Britain, including the Northern Ireland exception under the Windsor Framework.</desc>

  <rect width="800" height="600" fill="#FFFFFF"></rect>

  
  <line x1="40" y1="60" x2="760" y2="60" stroke="#000000" stroke-width="1"></line>
  <text x="40" y="42" font-size="13" font-weight="bold" fill="#000000">Figure 1.</text>
  <text x="100" y="42" font-size="13" fill="#000000">UK pet importation regime — before and after Brexit.</text>
  <text x="40" y="76" font-size="9.5" font-style="italic" fill="#666666">Source: Reg. (EU) 576/2013; APHA / DEFRA Pet Travel Scheme (effective 2021-01-01); Windsor Framework (2023) for Northern Ireland.</text>

  
  <line x1="80" y1="220" x2="720" y2="220" stroke="#000000" stroke-width="1.6"></line>
  <polygon points="720,220 712,216 712,224" fill="#000000"></polygon>

  
  <line x1="400" y1="120" x2="400" y2="430" stroke="#1A5276" stroke-width="1.4" stroke-dasharray="6,3"></line>
  <circle cx="400" cy="220" r="9" fill="#1A5276" stroke="#000000" stroke-width="1"></circle>
  <text x="400" y="110" font-size="11" text-anchor="middle" fill="#1A5276" font-weight="bold">1 January 2021</text>
  <text x="400" y="446" font-size="10" text-anchor="middle" fill="#1A5276" font-style="italic">UK leaves EU pet passport system</text>

  
  <text x="220" y="165" font-size="13" text-anchor="middle" fill="#000000" font-weight="bold">PRE-BREXIT REGIME</text>
  <text x="220" y="181" font-size="9.5" text-anchor="middle" fill="#666666" font-style="italic">2014 – 2020</text>

  <text x="580" y="165" font-size="13" text-anchor="middle" fill="#1A5276" font-weight="bold">POST-BREXIT REGIME</text>
  <text x="580" y="181" font-size="9.5" text-anchor="middle" fill="#666666" font-style="italic">from 2021 onwards</text>

  
  <g>
    <rect x="80" y="195" width="300" height="200" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"></rect>
    <text x="95" y="215" font-size="10.5" font-weight="bold" fill="#000000">Instrument</text>
    <text x="220" y="215" font-size="10.5" text-anchor="middle" fill="#000000">EU Pet Passport</text>

    <line x1="95" y1="225" x2="370" y2="225" stroke="#666666" stroke-width="0.4"></line>

    <text x="95" y="244" font-size="10.5" font-weight="bold" fill="#000000">Legal basis</text>
    <text x="220" y="244" font-size="10.5" text-anchor="middle" fill="#000000">Reg. (EU) 576/2013</text>

    <line x1="95" y1="254" x2="370" y2="254" stroke="#666666" stroke-width="0.4"></line>

    <text x="95" y="273" font-size="10.5" font-weight="bold" fill="#000000">Validity</text>
    <text x="220" y="273" font-size="10.5" text-anchor="middle" fill="#000000">lifetime, if vax current</text>

    <line x1="95" y1="283" x2="370" y2="283" stroke="#666666" stroke-width="0.4"></line>

    <text x="95" y="302" font-size="10.5" font-weight="bold" fill="#000000">Issuer</text>
    <text x="220" y="302" font-size="10.5" text-anchor="middle" fill="#000000">authorised EU vet</text>

    <line x1="95" y1="312" x2="370" y2="312" stroke="#666666" stroke-width="0.4"></line>

    <text x="95" y="331" font-size="10.5" font-weight="bold" fill="#000000">Scope</text>
    <text x="220" y="331" font-size="10.5" text-anchor="middle" fill="#000000">UK + EU (single space)</text>

    <line x1="95" y1="341" x2="370" y2="341" stroke="#666666" stroke-width="0.4"></line>

    <text x="95" y="360" font-size="10.5" font-weight="bold" fill="#000000">Tapeworm rule</text>
    <text x="220" y="360" font-size="10.5" text-anchor="middle" fill="#000000">required (dogs)</text>

    <line x1="95" y1="370" x2="370" y2="370" stroke="#666666" stroke-width="0.4"></line>

    <text x="95" y="388" font-size="10.5" font-weight="bold" fill="#000000">Peru route</text>
    <text x="220" y="388" font-size="10.5" text-anchor="middle" fill="#000000">non-listed third country</text>
  </g>

  
  <g>
    <rect x="420" y="195" width="300" height="200" fill="#FFFFFF" stroke="#1A5276" stroke-width="1.4"></rect>
    <text x="435" y="215" font-size="10.5" font-weight="bold" fill="#000000">Instrument</text>
    <text x="570" y="215" font-size="10.5" text-anchor="middle" fill="#1A5276" font-weight="bold">Animal Health Certificate</text>

    <line x1="435" y1="225" x2="710" y2="225" stroke="#666666" stroke-width="0.4"></line>

    <text x="435" y="244" font-size="10.5" font-weight="bold" fill="#000000">Legal basis</text>
    <text x="570" y="244" font-size="10.5" text-anchor="middle" fill="#000000">UK Pet Travel Scheme</text>

    <line x1="435" y1="254" x2="710" y2="254" stroke="#666666" stroke-width="0.4"></line>

    <text x="435" y="273" font-size="10.5" font-weight="bold" fill="#000000">Validity</text>
    <text x="570" y="273" font-size="10.5" text-anchor="middle" fill="#1A5276" font-weight="bold">≤ 10 d — single use</text>

    <line x1="435" y1="283" x2="710" y2="283" stroke="#666666" stroke-width="0.4"></line>

    <text x="435" y="302" font-size="10.5" font-weight="bold" fill="#000000">Issuer</text>
    <text x="570" y="302" font-size="10.5" text-anchor="middle" fill="#000000">official vet (origin)</text>

    <line x1="435" y1="312" x2="710" y2="312" stroke="#666666" stroke-width="0.4"></line>

    <text x="435" y="331" font-size="10.5" font-weight="bold" fill="#000000">Scope</text>
    <text x="570" y="331" font-size="10.5" text-anchor="middle" fill="#000000">Great Britain only</text>

    <line x1="435" y1="341" x2="710" y2="341" stroke="#666666" stroke-width="0.4"></line>

    <text x="435" y="360" font-size="10.5" font-weight="bold" fill="#000000">Tapeworm rule</text>
    <text x="570" y="360" font-size="10.5" text-anchor="middle" fill="#000000">required (dogs)</text>

    <line x1="435" y1="370" x2="710" y2="370" stroke="#666666" stroke-width="0.4"></line>

    <text x="435" y="388" font-size="10.5" font-weight="bold" fill="#000000">Peru route</text>
    <text x="570" y="388" font-size="10.5" text-anchor="middle" fill="#000000">full Part 2 protocol</text>
  </g>

  
  <g>
    <rect x="80" y="475" width="640" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"></rect>
    <text x="95" y="495" font-size="11" font-weight="bold" fill="#1A5276">Northern Ireland exception —</text>
    <text x="270" y="495" font-size="10.5" fill="#000000">Windsor Framework (2023)</text>
    <text x="95" y="512" font-size="10" fill="#000000">Animals entering Northern Ireland from third countries may continue to use the EU framework under Reg. (EU) 576/2013,</text>
    <text x="95" y="525" font-size="10" fill="#000000">rather than the APHA / DEFRA AHC regime that applies to Great Britain.</text>
  </g>

  
  <text x="40" y="558" font-size="9.5" fill="#666666" font-style="italic">Note — Peru was never on the EU simplified entry list. The Brexit transition is administrative (passport → AHC), not technical, for Peruvian exporters: microchip, rabies vaccination,</text>
  <text x="40" y="571" font-size="9.5" fill="#666666" font-style="italic">RFFIT ≥ 0.5 IU/mL, 3-month post-titre wait and praziquantel still apply.</text>

  
  <text x="760" y="592" font-size="8.5" fill="#666666" text-anchor="end">© Jessica Y. Camacho Garcia, MVZ — CMVP 12434 | Zoovet Travel — Technical Series Vol. XIV | zoovettravel.com | 2026</text>
</svg>