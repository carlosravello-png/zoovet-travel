<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" font-family="Times New Roman, serif">
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
