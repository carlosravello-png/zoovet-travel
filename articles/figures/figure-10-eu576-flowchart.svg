  <title>Figure 2. Non-commercial pet movement under Regulation (EU) 576/2013 — decision flowchart.</title>
  <desc>Branching flowchart of the documentary regime required to move a dog, cat or ferret under Regulation (EU) 576/2013, distinguishing intra-community movement (EU Pet Passport) from entry from Annex II Part 1 countries (simplified third-country certificate) and from Annex II Part 2 / non-listed countries such as Peru (full high-risk protocol with RFFIT and 3-month post-sample waiting period).</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"></path>
    </marker>
    <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1A5276"></path>
    </marker>
  </defs>

  <rect width="600" height="800" fill="#FFFFFF"></rect>

  
  <line x1="40" y1="60" x2="560" y2="60" stroke="#000000" stroke-width="1"></line>
  <text x="40" y="42" font-size="13" font-weight="bold" fill="#000000">Figure 2.</text>
  <text x="100" y="42" font-size="13" fill="#000000">Non-commercial pet movement — Reg. (EU) 576/2013.</text>
  <text x="40" y="76" font-size="9.5" font-style="italic" fill="#666666">Sequential decision tree across origin-zone, sanitary and documentary conditions. Source: Reg. (EU) 576/2013 + Impl. Reg. (EU) 577/2013 Annex IV.</text>

  
  <rect x="200" y="92" width="200" height="32" fill="#1A5276" stroke="#000000" stroke-width="1"></rect>
  <text x="300" y="113" font-size="12" text-anchor="middle" fill="#FFFFFF" font-weight="bold">PET to be moved into / within EU</text>
  <line x1="300" y1="124" x2="300" y2="142" stroke="#000000" stroke-width="1.2" marker-end="url(#arr)"></line>

  
  <polygon points="300,148 425,200 300,252 175,200" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"></polygon>
  <text x="300" y="190" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">Origin zone?</text>
  <text x="300" y="206" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">(Annex II classification)</text>

  
  
  <line x1="175" y1="200" x2="100" y2="200" stroke="#000000" stroke-width="1"></line>
  <line x1="100" y1="200" x2="100" y2="290" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="138" y="194" font-size="9.5" text-anchor="middle" fill="#000000" font-weight="bold">EU + EEA</text>

  
  <line x1="300" y1="252" x2="300" y2="290" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="312" y="278" font-size="9.5" fill="#000000" font-weight="bold">Part 1</text>

  
  <line x1="425" y1="200" x2="500" y2="200" stroke="#1A5276" stroke-width="1.4"></line>
  <line x1="500" y1="200" x2="500" y2="290" stroke="#1A5276" stroke-width="1.4" marker-end="url(#arrAcc)"></line>
  <text x="462" y="194" font-size="9.5" text-anchor="middle" fill="#1A5276" font-weight="bold">Part 2 /</text>
  <text x="462" y="208" font-size="9.5" text-anchor="middle" fill="#1A5276" font-weight="bold">non-listed</text>

  
  <rect x="55" y="290" width="90" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="1"></rect>
  <text x="100" y="308" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">EU passport</text>
  <text x="100" y="324" font-size="9" text-anchor="middle" fill="#000000">Microchip +</text>
  <text x="100" y="336" font-size="9" text-anchor="middle" fill="#000000">rabies vax</text>
  <text x="100" y="348" font-size="9" text-anchor="middle" fill="#000000">valid (≥ 21 d).</text>
  <text x="100" y="364" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">no RFFIT</text>

  <rect x="240" y="290" width="120" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="1"></rect>
  <text x="300" y="308" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">Annex IV cert.</text>
  <text x="300" y="324" font-size="9" text-anchor="middle" fill="#000000">Microchip +</text>
  <text x="300" y="336" font-size="9" text-anchor="middle" fill="#000000">rabies vax ≥ 21 d</text>
  <text x="300" y="348" font-size="9" text-anchor="middle" fill="#000000">+ official vet cert.</text>
  <text x="300" y="364" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">no RFFIT</text>

  <rect x="455" y="290" width="90" height="80" fill="#1A5276" stroke="#000000" stroke-width="1.2"></rect>
  <text x="500" y="308" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="bold">High-risk</text>
  <text x="500" y="320" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="bold">protocol</text>
  <text x="500" y="338" font-size="9" text-anchor="middle" fill="#FFFFFF">Microchip → vax →</text>
  <text x="500" y="350" font-size="9" text-anchor="middle" fill="#FFFFFF">RFFIT → 3-mo wait</text>
  <text x="500" y="364" font-size="9" text-anchor="middle" fill="#FFFFFF" font-style="italic">(Peru route)</text>

  
  <line x1="100" y1="370" x2="100" y2="400" stroke="#000000" stroke-width="1"></line>
  <line x1="100" y1="400" x2="290" y2="400" stroke="#000000" stroke-width="1"></line>
  <line x1="300" y1="370" x2="300" y2="400" stroke="#000000" stroke-width="1"></line>
  <line x1="500" y1="370" x2="500" y2="400" stroke="#1A5276" stroke-width="1"></line>
  <line x1="500" y1="400" x2="310" y2="400" stroke="#1A5276" stroke-width="1"></line>
  <line x1="300" y1="400" x2="300" y2="420" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>

  
  <polygon points="300,425 410,470 300,515 190,470" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"></polygon>
  <text x="300" y="460" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">Microchip implanted</text>
  <text x="300" y="474" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">BEFORE rabies vaccine?</text>
  <text x="300" y="490" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">(Art. 17 + Annex III)</text>
  <line x1="410" y1="470" x2="478" y2="470" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="444" y="464" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">NO</text>
  <line x1="300" y1="515" x2="300" y2="540" stroke="#1A5276" stroke-width="1.4" marker-end="url(#arrAcc)"></line>
  <text x="312" y="533" font-size="10" fill="#1A5276" font-weight="bold">YES</text>

  
  <polygon points="300,545 425,595 300,645 175,595" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"></polygon>
  <text x="300" y="585" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">If high-risk: ≥ 3 months</text>
  <text x="300" y="599" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">from RFFIT sample date?</text>
  <text x="300" y="615" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">(EU-approved lab; ≥ 0.5 IU/mL)</text>
  <line x1="425" y1="595" x2="478" y2="595" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="452" y="589" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">NO</text>
  <line x1="300" y1="645" x2="300" y2="665" stroke="#1A5276" stroke-width="1.4"></line>

  
  <rect x="160" y="665" width="280" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"></rect>
  <text x="300" y="683" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">Annex IV cert. ≤ 10 days +</text>
  <text x="300" y="699" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">Member-State add-ons met?</text>
  <line x1="440" y1="687" x2="478" y2="687" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="458" y="681" font-size="9.5" text-anchor="middle" fill="#000000" font-weight="bold">NO</text>
  <line x1="300" y1="709" x2="300" y2="730" stroke="#1A5276" stroke-width="1.6" marker-end="url(#arrAcc)"></line>
  <text x="312" y="725" font-size="10" fill="#1A5276" font-weight="bold">YES</text>

  
  <rect x="120" y="735" width="360" height="38" fill="#1A5276" stroke="#000000" stroke-width="1"></rect>
  <text x="300" y="751" font-size="12" text-anchor="middle" fill="#FFFFFF" font-weight="bold">ENTRY TO EU PERMITTED</text>
  <text x="300" y="765" font-size="9.5" text-anchor="middle" fill="#FFFFFF" font-style="italic">TRACES NT registration if applicable</text>

  
  <rect x="478" y="170" width="100" height="490" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"></rect>
  <text x="528" y="192" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">ENTRY DENIED</text>
  <line x1="488" y1="200" x2="568" y2="200" stroke="#000000" stroke-width="0.6"></line>
  <text x="528" y="220" font-size="9" text-anchor="middle" fill="#000000">Border refusal,</text>
  <text x="528" y="232" font-size="9" text-anchor="middle" fill="#000000">return shipment,</text>
  <text x="528" y="244" font-size="9" text-anchor="middle" fill="#000000">or isolation</text>
  <text x="528" y="256" font-size="9" text-anchor="middle" fill="#000000">at owner cost.</text>
  <text x="528" y="280" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">Triggers (any):</text>
  <text x="528" y="300" font-size="9" text-anchor="middle" fill="#000000">• Microchip after</text>
  <text x="528" y="312" font-size="9" text-anchor="middle" fill="#000000">  vaccination</text>
  <text x="528" y="332" font-size="9" text-anchor="middle" fill="#000000">• RFFIT &lt; 0.5 IU/mL</text>
  <text x="528" y="344" font-size="9" text-anchor="middle" fill="#000000">  or non-EU lab</text>
  <text x="528" y="364" font-size="9" text-anchor="middle" fill="#000000">• &lt; 3 mo from</text>
  <text x="528" y="376" font-size="9" text-anchor="middle" fill="#000000">  sample date</text>
  <text x="528" y="396" font-size="9" text-anchor="middle" fill="#000000">• Cert. &gt; 10 d</text>
  <text x="528" y="408" font-size="9" text-anchor="middle" fill="#000000">  before entry</text>
  <text x="528" y="428" font-size="9" text-anchor="middle" fill="#000000">• Missing FI/MT/IE/</text>
  <text x="528" y="440" font-size="9" text-anchor="middle" fill="#000000">  ES add-ons</text>

  
  <text x="560" y="788" font-size="8" fill="#666666" text-anchor="end">© Jessica Y. Camacho Garcia, MVZ — CMVP 12434 | Zoovet Travel — Technical Series Vol. XVII | zoovettravel.com | 2026</text>
</svg>