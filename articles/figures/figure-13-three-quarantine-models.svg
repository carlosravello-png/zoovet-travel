  <title>Figure 1. Three regulatory models of quarantine in international pet importation.</title>
  <desc>Comparative classification of three structurally distinct quarantine regimes: Model A mandatory post-entry quarantine (Australia DAFF, New Zealand MPI); Model B conditional quarantine triggered only by non-compliance (EU Reg. 576/2013 art. 35, UK APHA); Model C no general quarantine but federal retention authority (US CDC Dog Import Rule).</desc>

  <rect width="800" height="600" fill="#FFFFFF"></rect>

  
  <line x1="40" y1="60" x2="760" y2="60" stroke="#000000" stroke-width="1"></line>
  <text x="40" y="42" font-size="13" font-weight="bold" fill="#000000">Figure 1.</text>
  <text x="100" y="42" font-size="13" fill="#000000">Three regulatory models of quarantine in international pet importation.</text>
  <text x="40" y="76" font-size="9.5" font-style="italic" fill="#666666">Comparative classification across destination regimes. Verify the current rule with each competent authority before each export.</text>

  
  
  <g>
    <rect x="40" y="95" width="240" height="48" fill="#1A5276" stroke="#000000" stroke-width="1"></rect>
    <text x="160" y="116" font-size="13" text-anchor="middle" fill="#FFFFFF" font-weight="bold">MODEL A</text>
    <text x="160" y="133" font-size="10.5" text-anchor="middle" fill="#FFFFFF">Mandatory PEQ (structural)</text>

    <rect x="290" y="95" width="240" height="48" fill="#666666" stroke="#000000" stroke-width="1"></rect>
    <text x="410" y="116" font-size="13" text-anchor="middle" fill="#FFFFFF" font-weight="bold">MODEL B</text>
    <text x="410" y="133" font-size="10.5" text-anchor="middle" fill="#FFFFFF">Conditional (non-compliance)</text>

    <rect x="540" y="95" width="240" height="48" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"></rect>
    <text x="660" y="116" font-size="13" text-anchor="middle" fill="#000000" font-weight="bold">MODEL C</text>
    <text x="660" y="133" font-size="10.5" text-anchor="middle" fill="#000000">No general PEQ; retention only</text>
  </g>

  
  <g>
    <rect x="40" y="148" width="240" height="32" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"></rect>
    <text x="160" y="167" font-size="10.5" text-anchor="middle" fill="#000000" font-weight="bold">Australia (DAFF) · NZ (MPI)</text>

    <rect x="290" y="148" width="240" height="32" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"></rect>
    <text x="410" y="167" font-size="10.5" text-anchor="middle" fill="#000000" font-weight="bold">European Union · United Kingdom</text>

    <rect x="540" y="148" width="240" height="32" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"></rect>
    <text x="660" y="167" font-size="10.5" text-anchor="middle" fill="#000000" font-weight="bold">United States (CDC)</text>
  </g>

  
  <g>
    <rect x="40" y="185" width="240" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="0.6"></rect>
    <text x="50" y="201" font-size="9" font-weight="bold" fill="#666666">TRIGGER</text>
    <text x="50" y="219" font-size="10" fill="#000000">Every animal, by design.</text>
    <text x="50" y="232" font-size="10" fill="#000000">Quarantine is structural,</text>
    <text x="50" y="244" font-size="10" fill="#000000">not a sanction.</text>

    <rect x="290" y="185" width="240" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="0.6"></rect>
    <text x="300" y="201" font-size="9" font-weight="bold" fill="#666666">TRIGGER</text>
    <text x="300" y="219" font-size="10" fill="#000000">Triggered only by</text>
    <text x="300" y="232" font-size="10" fill="#000000">documentary or technical</text>
    <text x="300" y="244" font-size="10" fill="#000000">non-compliance.</text>

    <rect x="540" y="185" width="240" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="0.6"></rect>
    <text x="550" y="201" font-size="9" font-weight="bold" fill="#666666">TRIGGER</text>
    <text x="550" y="219" font-size="10" fill="#000000">Triggered only by border</text>
    <text x="550" y="232" font-size="10" fill="#000000">officer or CDC retention</text>
    <text x="550" y="244" font-size="10" fill="#000000">authority decision.</text>
  </g>

  
  <g>
    <rect x="40" y="245" width="240" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="0.6"></rect>
    <text x="50" y="261" font-size="9" font-weight="bold" fill="#666666">LEGAL BASIS</text>
    <text x="50" y="279" font-size="10" fill="#000000">DAFF Biosecurity Act 2015;</text>
    <text x="50" y="291" font-size="10" fill="#000000">MPI Import Health</text>
    <text x="50" y="303" font-size="10" fill="#000000">Standard CATDOG.GEN.</text>

    <rect x="290" y="245" width="240" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="0.6"></rect>
    <text x="300" y="261" font-size="9" font-weight="bold" fill="#666666">LEGAL BASIS</text>
    <text x="300" y="279" font-size="10" fill="#000000">Reg. (EU) 576/2013 art. 35;</text>
    <text x="300" y="291" font-size="10" fill="#000000">UK Pet Travel Scheme</text>
    <text x="300" y="303" font-size="10" fill="#000000">(APHA / DEFRA).</text>

    <rect x="540" y="245" width="240" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="0.6"></rect>
    <text x="550" y="261" font-size="9" font-weight="bold" fill="#666666">LEGAL BASIS</text>
    <text x="550" y="279" font-size="10" fill="#000000">CDC Dog Import Rule</text>
    <text x="550" y="291" font-size="10" fill="#000000">(2024); 42 CFR Part 71;</text>
    <text x="550" y="303" font-size="10" fill="#000000">+ destination-State rules.</text>
  </g>

  
  <g>
    <rect x="40" y="305" width="240" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="0.6"></rect>
    <text x="50" y="321" font-size="9" font-weight="bold" fill="#666666">DURATION</text>
    <text x="160" y="341" font-size="14" text-anchor="middle" fill="#1A5276" font-weight="bold">10 d (NZ) — 10+ d (AU)</text>
    <text x="160" y="358" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">extendable on clinical findings</text>

    <rect x="290" y="305" width="240" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="0.6"></rect>
    <text x="300" y="321" font-size="9" font-weight="bold" fill="#666666">DURATION</text>
    <text x="410" y="341" font-size="14" text-anchor="middle" fill="#1A5276" font-weight="bold">up to 4 months (UK)</text>
    <text x="410" y="358" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">until criteria are met</text>

    <rect x="540" y="305" width="240" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="0.6"></rect>
    <text x="550" y="321" font-size="9" font-weight="bold" fill="#666666">DURATION</text>
    <text x="660" y="341" font-size="14" text-anchor="middle" fill="#1A5276" font-weight="bold">case-by-case</text>
    <text x="660" y="358" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">ACF holding until cleared</text>
  </g>

  
  <g>
    <rect x="40" y="365" width="240" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="0.6"></rect>
    <text x="50" y="381" font-size="9" font-weight="bold" fill="#666666">FACILITY</text>
    <text x="50" y="399" font-size="10" fill="#000000">Mickleham (Melbourne);</text>
    <text x="50" y="411" font-size="10" fill="#000000">MPI-accredited Auckland;</text>
    <text x="50" y="423" font-size="10" fill="#000000">advance booking required.</text>

    <rect x="290" y="365" width="240" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="0.6"></rect>
    <text x="300" y="381" font-size="9" font-weight="bold" fill="#666666">FACILITY</text>
    <text x="300" y="399" font-size="10" fill="#000000">Authorised holding centres</text>
    <text x="300" y="411" font-size="10" fill="#000000">(Member-State / APHA-</text>
    <text x="300" y="423" font-size="10" fill="#000000">approved kennels).</text>

    <rect x="540" y="365" width="240" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="0.6"></rect>
    <text x="550" y="381" font-size="9" font-weight="bold" fill="#666666">FACILITY</text>
    <text x="550" y="399" font-size="10" fill="#000000">CDC-registered Animal</text>
    <text x="550" y="411" font-size="10" fill="#000000">Care Facilities (ACF) at</text>
    <text x="550" y="423" font-size="10" fill="#000000">selected airports only.</text>
  </g>

  
  <g>
    <rect x="40" y="425" width="240" height="62" fill="#FFFFFF" stroke="#000000" stroke-width="0.6"></rect>
    <text x="50" y="441" font-size="9" font-weight="bold" fill="#666666">OUTCOMES</text>
    <text x="50" y="459" font-size="10" fill="#000000">Extended PEQ; further tests;</text>
    <text x="50" y="471" font-size="10" fill="#000000">repatriation; in extreme</text>
    <text x="50" y="483" font-size="10" fill="#000000">cases euthanasia.</text>

    <rect x="290" y="425" width="240" height="62" fill="#FFFFFF" stroke="#000000" stroke-width="0.6"></rect>
    <text x="300" y="441" font-size="9" font-weight="bold" fill="#666666">OUTCOMES</text>
    <text x="300" y="459" font-size="10" fill="#000000">Re-export to origin; supervised</text>
    <text x="300" y="471" font-size="10" fill="#000000">isolation until criteria met;</text>
    <text x="300" y="483" font-size="10" fill="#000000">euthanasia as last resort.</text>

    <rect x="540" y="425" width="240" height="62" fill="#FFFFFF" stroke="#000000" stroke-width="0.6"></rect>
    <text x="550" y="441" font-size="9" font-weight="bold" fill="#666666">OUTCOMES</text>
    <text x="550" y="459" font-size="10" fill="#000000">ACF holding; denial of entry;</text>
    <text x="550" y="471" font-size="10" fill="#000000">re-export. Strict at high-risk</text>
    <text x="550" y="483" font-size="10" fill="#000000">DMRVV-country routings.</text>
  </g>

  
  <g>
    <rect x="40" y="487" width="240" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="0.6"></rect>
    <text x="50" y="503" font-size="9" font-weight="bold" fill="#666666">COST</text>
    <text x="50" y="517" font-size="10" fill="#000000">Owner — full PEQ fees.</text>

    <rect x="290" y="487" width="240" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="0.6"></rect>
    <text x="300" y="503" font-size="9" font-weight="bold" fill="#666666">COST</text>
    <text x="300" y="517" font-size="10" fill="#000000">Owner — including re-export.</text>

    <rect x="540" y="487" width="240" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="0.6"></rect>
    <text x="550" y="503" font-size="9" font-weight="bold" fill="#666666">COST</text>
    <text x="550" y="517" font-size="10" fill="#000000">Owner — ACF + handling.</text>
  </g>

  
  <line x1="40" y1="540" x2="760" y2="540" stroke="#000000" stroke-width="0.6"></line>
  <text x="40" y="558" font-size="10" fill="#000000"><tspan font-weight="bold">Key takeaway —</tspan> Models B and C are largely avoidable through a technically correct dossier. Model A cannot be avoided; only its duration can be optimised.</text>
  <text x="40" y="572" font-size="9.5" fill="#666666" font-style="italic">DMRVV = dog-mediated rabies virus variant. PEQ = post-entry quarantine. ACF = CDC Animal Care Facility.</text>

  
  <text x="760" y="592" font-size="8.5" fill="#666666" text-anchor="end">© Jessica Y. Camacho Garcia, MVZ — CMVP 12434 | Zoovet Travel — Technical Series Vol. XI | zoovettravel.com | 2026</text>
</svg>