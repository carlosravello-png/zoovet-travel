  <title>Figure 2. Mandatory 10-day quarantine sequence at MPI-accredited facility.</title>
  <desc>Gantt-style timeline of the 10-day mandatory quarantine at an MPI-accredited facility in Auckland, showing arrival inspection, veterinary checks, parasitology screening, documentary audit, and the three possible day-10 outcomes (release, extension, repatriation).</desc>

  <rect width="800" height="600" fill="#FFFFFF"></rect>

  
  <line x1="40" y1="60" x2="760" y2="60" stroke="#000000" stroke-width="1"></line>
  <text x="40" y="42" font-size="13" font-weight="bold" fill="#000000">Figure 2.</text>
  <text x="100" y="42" font-size="13" fill="#000000">Mandatory quarantine sequence — MPI-accredited facility, Auckland.</text>
  <text x="40" y="76" font-size="9.5" font-style="italic" fill="#666666">Schematic Gantt of post-arrival activities for dogs/cats from Group 3 countries (incl. Peru). All costs borne by the owner. Source: MPI IHS 154.02.06.</text>

  
  
  <line x1="110" y1="420" x2="700" y2="420" stroke="#000000" stroke-width="1.4"></line>
  <polygon points="700,420 692,416 692,424" fill="#000000"></polygon>

  
  <g font-size="10" fill="#000000">
    <g stroke="#000000">
      <line x1="110" y1="420" x2="110" y2="426"></line>
      <line x1="169" y1="420" x2="169" y2="426"></line>
      <line x1="228" y1="420" x2="228" y2="426"></line>
      <line x1="287" y1="420" x2="287" y2="426"></line>
      <line x1="346" y1="420" x2="346" y2="426"></line>
      <line x1="405" y1="420" x2="405" y2="426"></line>
      <line x1="464" y1="420" x2="464" y2="426"></line>
      <line x1="523" y1="420" x2="523" y2="426"></line>
      <line x1="582" y1="420" x2="582" y2="426"></line>
      <line x1="641" y1="420" x2="641" y2="426"></line>
      <line x1="700" y1="420" x2="700" y2="426"></line>
    </g>
    <text x="110" y="440" text-anchor="middle">D0</text>
    <text x="169" y="440" text-anchor="middle">D1</text>
    <text x="228" y="440" text-anchor="middle">D2</text>
    <text x="287" y="440" text-anchor="middle">D3</text>
    <text x="346" y="440" text-anchor="middle">D4</text>
    <text x="405" y="440" text-anchor="middle">D5</text>
    <text x="464" y="440" text-anchor="middle">D6</text>
    <text x="523" y="440" text-anchor="middle">D7</text>
    <text x="582" y="440" text-anchor="middle">D8</text>
    <text x="641" y="440" text-anchor="middle">D9</text>
    <text x="700" y="440" text-anchor="middle">D10</text>
  </g>
  <text x="405" y="462" font-size="11" text-anchor="middle" fill="#000000">Days in MPI quarantine</text>

  
  
  <g font-size="10" fill="#000000">
    <text x="100" y="110" text-anchor="end">Arrival &amp; intake</text>
    <text x="100" y="145" text-anchor="end">Microchip verification</text>
    <text x="100" y="180" text-anchor="end">MPI veterinary inspection</text>
    <text x="100" y="215" text-anchor="end">Parasitology screening</text>
    <text x="100" y="250" text-anchor="end">Documentary audit</text>
    <text x="100" y="285" text-anchor="end">Welfare monitoring</text>
    <text x="100" y="320" text-anchor="end">Pre-release veterinary check</text>
    <text x="100" y="355" text-anchor="end">D10 outcome decision</text>
  </g>

  
  <g stroke="#666666" stroke-width="0.3" stroke-dasharray="2,3" opacity="0.5">
    <line x1="169" y1="92" x2="169" y2="420"></line>
    <line x1="228" y1="92" x2="228" y2="420"></line>
    <line x1="287" y1="92" x2="287" y2="420"></line>
    <line x1="346" y1="92" x2="346" y2="420"></line>
    <line x1="405" y1="92" x2="405" y2="420"></line>
    <line x1="464" y1="92" x2="464" y2="420"></line>
    <line x1="523" y1="92" x2="523" y2="420"></line>
    <line x1="582" y1="92" x2="582" y2="420"></line>
    <line x1="641" y1="92" x2="641" y2="420"></line>
  </g>

  
  
  <rect x="110" y="100" width="35" height="14" fill="#1A5276" stroke="#000000" stroke-width="0.6"></rect>
  <text x="150" y="111" font-size="9" fill="#000000">tarmac → facility</text>

  
  <rect x="110" y="135" width="40" height="14" fill="#1A5276" stroke="#000000" stroke-width="0.6"></rect>
  <text x="156" y="146" font-size="9" fill="#000000">ISO chip read</text>

  
  <rect x="110" y="170" width="30" height="14" fill="#1A5276" stroke="#000000" stroke-width="0.6"></rect>
  <rect x="287" y="170" width="30" height="14" fill="#1A5276" stroke="#000000" stroke-width="0.6"></rect>
  <rect x="641" y="170" width="59" height="14" fill="#1A5276" stroke="#000000" stroke-width="0.6"></rect>
  <text x="146" y="181" font-size="8.5" fill="#666666" font-style="italic">D0</text>
  <text x="323" y="181" font-size="8.5" fill="#666666" font-style="italic">D3</text>
  <text x="630" y="181" font-size="8.5" fill="#666666" font-style="italic" text-anchor="end">D9–D10</text>

  
  <rect x="169" y="205" width="118" height="14" fill="#666666" stroke="#000000" stroke-width="0.6"></rect>
  <text x="295" y="216" font-size="9" fill="#000000">faecal + ectoparasite</text>

  
  <rect x="110" y="240" width="177" height="14" fill="#666666" stroke="#000000" stroke-width="0.6"></rect>
  <text x="295" y="251" font-size="9" fill="#000000">cross-check AHC ↔ chip ↔ RFFIT</text>

  
  <rect x="110" y="275" width="590" height="14" fill="#1A5276" stroke="#000000" stroke-width="0.6" fill-opacity="0.25"></rect>
  <text x="405" y="286" font-size="9" text-anchor="middle" fill="#000000">daily clinical observation, feeding &amp; husbandry</text>

  
  <rect x="582" y="310" width="59" height="14" fill="#1A5276" stroke="#000000" stroke-width="0.6"></rect>
  <text x="650" y="321" font-size="9" fill="#000000">final clinical exam</text>

  
  <circle cx="700" cy="352" r="6" fill="#1A5276" stroke="#000000" stroke-width="1"></circle>
  <text x="690" y="356" font-size="9" text-anchor="end" fill="#000000" font-weight="bold">decision node</text>

  
  
  
  <g>
    
    <rect x="110" y="480" width="180" height="78" fill="#FFFFFF" stroke="#000000" stroke-width="1"></rect>
    <text x="200" y="498" font-size="11" text-anchor="middle" fill="#1A5276" font-weight="bold">RELEASE</text>
    <line x1="120" y1="504" x2="280" y2="504" stroke="#666666" stroke-width="0.4"></line>
    <text x="200" y="520" font-size="9.5" text-anchor="middle" fill="#000000">All audits clear.</text>
    <text x="200" y="534" font-size="9.5" text-anchor="middle" fill="#000000">Animal handed to</text>
    <text x="200" y="548" font-size="9.5" text-anchor="middle" fill="#000000">owner / agent.</text>

    <rect x="310" y="480" width="180" height="78" fill="#FFFFFF" stroke="#000000" stroke-width="1"></rect>
    <text x="400" y="498" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">EXTENSION</text>
    <line x1="320" y1="504" x2="480" y2="504" stroke="#666666" stroke-width="0.4"></line>
    <text x="400" y="520" font-size="9.5" text-anchor="middle" fill="#000000">Documentary or</text>
    <text x="400" y="534" font-size="9.5" text-anchor="middle" fill="#000000">clinical anomaly →</text>
    <text x="400" y="548" font-size="9.5" text-anchor="middle" fill="#000000">extended quarantine.</text>

    <rect x="510" y="480" width="190" height="78" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"></rect>
    <text x="605" y="498" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">REPATRIATION</text>
    <line x1="520" y1="504" x2="690" y2="504" stroke="#666666" stroke-width="0.4"></line>
    <text x="605" y="520" font-size="9.5" text-anchor="middle" fill="#000000">Non-compliance →</text>
    <text x="605" y="534" font-size="9.5" text-anchor="middle" fill="#000000">return to origin,</text>
    <text x="605" y="548" font-size="9.5" text-anchor="middle" fill="#000000">owner pays return flight.</text>
  </g>

  
  <line x1="700" y1="358" x2="700" y2="395" stroke="#000000" stroke-width="0.8"></line>
  <line x1="200" y1="395" x2="700" y2="395" stroke="#000000" stroke-width="0.8"></line>
  <line x1="200" y1="395" x2="200" y2="480" stroke="#1A5276" stroke-width="1" marker-end="url(#arr)"></line>
  <line x1="400" y1="395" x2="400" y2="480" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <line x1="605" y1="395" x2="605" y2="480" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>

  
  <g transform="translate(40,580)" font-size="9.5" fill="#000000">
    <rect x="0" y="-9" width="14" height="9" fill="#1A5276"></rect>
    <text x="20" y="-1">MPI-conducted activity</text>
    <rect x="170" y="-9" width="14" height="9" fill="#666666"></rect>
    <text x="190" y="-1">Documentary / lab-based</text>
    <rect x="340" y="-9" width="14" height="9" fill="#1A5276" fill-opacity="0.25" stroke="#1A5276"></rect>
    <text x="360" y="-1">Continuous monitoring</text>
  </g>

  
  <text x="760" y="595" font-size="8.5" fill="#666666" text-anchor="end">© Jessica Y. Camacho Garcia, MVZ — CMVP 12434 | Zoovet Travel — Technical Series Vol. XV | zoovettravel.com | 2026</text>
</svg>