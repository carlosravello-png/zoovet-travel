<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" font-family="Times New Roman, serif">
  <title>Figure 2. Animal Health Certificate (AHC) — issuance process and document anatomy.</title>
  <desc>Two-panel diagram. Left: linear issuance process showing the actors involved (official veterinarian, APHA endorsement, UK border officer) and the strict ≤10-day pre-travel window. Right: anatomy of the AHC document with its six mandatory content blocks (animal ID, owner declaration, rabies vaccination, RFFIT, parasiticide treatment, official vet attestation).</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"></path>
    </marker>
    <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1A5276"></path>
    </marker>
  </defs>

  <rect width="800" height="600" fill="#FFFFFF"></rect>

  
  <line x1="40" y1="60" x2="760" y2="60" stroke="#000000" stroke-width="1"></line>
  <text x="40" y="42" font-size="13" font-weight="bold" fill="#000000">Figure 2.</text>
  <text x="100" y="42" font-size="13" fill="#000000">Animal Health Certificate — issuance process and document anatomy.</text>
  <text x="40" y="76" font-size="9.5" font-style="italic" fill="#666666">Source: APHA Pet Travel guidance, DEFRA Statutory Guidance (2021–present). AHC is single-use; a new certificate is required for each journey to Great Britain.</text>

  
  <g>
    <text x="60" y="105" font-size="11" font-weight="bold" fill="#000000">A — Issuance process</text>
    <line x1="60" y1="112" x2="370" y2="112" stroke="#000000" stroke-width="0.6"></line>

    
    <rect x="60" y="130" width="310" height="48" fill="#FFFFFF" stroke="#000000" stroke-width="1"></rect>
    <circle cx="78" cy="154" r="10" fill="#1A5276" stroke="#000000" stroke-width="0.6"></circle>
    <text x="78" y="158" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="bold">1</text>
    <text x="98" y="149" font-size="10.5" font-weight="bold" fill="#000000">Owner books appointment with official veterinarian</text>
    <text x="98" y="164" font-size="9.5" fill="#666666">required ≤ 10 days before travel; brings all prior documents</text>
    <text x="98" y="176" font-size="9.5" fill="#666666" font-style="italic">microchip, rabies vax record, RFFIT result</text>

    <line x1="215" y1="178" x2="215" y2="194" stroke="#000000" stroke-width="1.2" marker-end="url(#arr)"></line>

    
    <rect x="60" y="198" width="310" height="62" fill="#FFFFFF" stroke="#000000" stroke-width="1"></rect>
    <circle cx="78" cy="229" r="10" fill="#1A5276" stroke="#000000" stroke-width="0.6"></circle>
    <text x="78" y="233" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="bold">2</text>
    <text x="98" y="218" font-size="10.5" font-weight="bold" fill="#000000">Official veterinarian issues &amp; signs AHC</text>
    <text x="98" y="232" font-size="9.5" fill="#666666">verifies microchip ↔ document; administers praziquantel</text>
    <text x="98" y="244" font-size="9.5" fill="#666666">(dogs only, 24 h – 5 d pre-entry); stamps and dates.</text>
    <text x="98" y="256" font-size="9.5" fill="#1A5276" font-style="italic">Day 0 of the 10-day clock</text>

    <line x1="215" y1="260" x2="215" y2="276" stroke="#000000" stroke-width="1.2" marker-end="url(#arr)"></line>

    
    <rect x="60" y="280" width="310" height="48" fill="#FFFFFF" stroke="#000000" stroke-width="1"></rect>
    <circle cx="78" cy="304" r="10" fill="#1A5276" stroke="#000000" stroke-width="0.6"></circle>
    <text x="78" y="308" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="bold">3</text>
    <text x="98" y="299" font-size="10.5" font-weight="bold" fill="#000000">APHA / consular endorsement (where applicable)</text>
    <text x="98" y="313" font-size="9.5" fill="#666666">authentication of official veterinarian&#39;s credentials</text>
    <text x="98" y="325" font-size="9.5" fill="#666666" font-style="italic">required by some destinations / carriers</text>

    <line x1="215" y1="328" x2="215" y2="344" stroke="#000000" stroke-width="1.2" marker-end="url(#arr)"></line>

    
    <rect x="60" y="348" width="310" height="48" fill="#FFFFFF" stroke="#000000" stroke-width="1"></rect>
    <circle cx="78" cy="372" r="10" fill="#1A5276" stroke="#000000" stroke-width="0.6"></circle>
    <text x="78" y="376" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="bold">4</text>
    <text x="98" y="367" font-size="10.5" font-weight="bold" fill="#000000">Travel to Great Britain within 10 days</text>
    <text x="98" y="381" font-size="9.5" fill="#1A5276" font-weight="bold">AHC expires at midnight of day 10</text>
    <text x="98" y="393" font-size="9.5" fill="#666666" font-style="italic">re-issuance required if exceeded</text>

    <line x1="215" y1="396" x2="215" y2="412" stroke="#1A5276" stroke-width="1.4" marker-end="url(#arrAcc)"></line>

    
    <rect x="60" y="416" width="310" height="48" fill="#1A5276" stroke="#000000" stroke-width="1"></rect>
    <circle cx="78" cy="440" r="10" fill="#FFFFFF" stroke="#000000" stroke-width="0.6"></circle>
    <text x="78" y="444" font-size="11" text-anchor="middle" fill="#1A5276" font-weight="bold">5</text>
    <text x="98" y="435" font-size="10.5" font-weight="bold" fill="#FFFFFF">UK border officer verifies AHC ↔ animal</text>
    <text x="98" y="449" font-size="9.5" fill="#FFFFFF">scans microchip; matches all 6 content blocks</text>
    <text x="98" y="461" font-size="9.5" fill="#FFFFFF" font-style="italic">accepted at designated travel point only</text>
  </g>

  
  <g>
    <text x="430" y="105" font-size="11" font-weight="bold" fill="#000000">B — AHC content blocks</text>
    <line x1="430" y1="112" x2="755" y2="112" stroke="#000000" stroke-width="0.6"></line>

    
    <rect x="430" y="125" width="325" height="345" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"></rect>
    <text x="592" y="146" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">ANIMAL HEALTH CERTIFICATE</text>
    <line x1="445" y1="152" x2="740" y2="152" stroke="#000000" stroke-width="0.4"></line>

    
    <rect x="445" y="160" width="295" height="48" fill="#FFFFFF" stroke="#666666" stroke-width="0.6"></rect>
    <text x="453" y="176" font-size="9.5" font-weight="bold" fill="#1A5276">§ 1 ANIMAL IDENTIFICATION</text>
    <text x="453" y="190" font-size="9.5" fill="#000000">ISO 11784/11785 microchip · species · breed</text>
    <text x="453" y="202" font-size="9.5" fill="#000000">sex · DOB · coat colour</text>

    
    <rect x="445" y="212" width="295" height="40" fill="#FFFFFF" stroke="#666666" stroke-width="0.6"></rect>
    <text x="453" y="228" font-size="9.5" font-weight="bold" fill="#1A5276">§ 2 OWNER DECLARATION</text>
    <text x="453" y="242" font-size="9.5" fill="#000000">non-commercial purpose · ≤ 5 animals</text>

    
    <rect x="445" y="256" width="295" height="48" fill="#FFFFFF" stroke="#666666" stroke-width="0.6"></rect>
    <text x="453" y="272" font-size="9.5" font-weight="bold" fill="#1A5276">§ 3 RABIES VACCINATION</text>
    <text x="453" y="286" font-size="9.5" fill="#000000">manufacturer · batch · date · validity</text>
    <text x="453" y="298" font-size="9.5" fill="#000000">microchip implanted BEFORE this date</text>

    
    <rect x="445" y="308" width="295" height="48" fill="#FFFFFF" stroke="#666666" stroke-width="0.6"></rect>
    <text x="453" y="324" font-size="9.5" font-weight="bold" fill="#1A5276">§ 4 RFFIT SEROLOGY (Part 2 / non-listed)</text>
    <text x="453" y="338" font-size="9.5" fill="#000000">sample date ≥ 30 d post-vax · ≥ 0.5 IU/mL</text>
    <text x="453" y="350" font-size="9.5" fill="#000000">approved laboratory · ≥ 3-month post-sample wait</text>

    
    <rect x="445" y="360" width="295" height="48" fill="#FFFFFF" stroke="#666666" stroke-width="0.6"></rect>
    <text x="453" y="376" font-size="9.5" font-weight="bold" fill="#1A5276">§ 5 ECHINOCOCCUS TREATMENT (dogs)</text>
    <text x="453" y="390" font-size="9.5" fill="#000000">praziquantel ≥ 50 mg/kg · vet-administered</text>
    <text x="453" y="402" font-size="9.5" fill="#000000">24 h – 5 d before entry · timestamped</text>

    
    <rect x="445" y="412" width="295" height="48" fill="#1A5276" stroke="#000000" stroke-width="0.6"></rect>
    <text x="453" y="428" font-size="9.5" font-weight="bold" fill="#FFFFFF">§ 6 OFFICIAL VETERINARIAN ATTESTATION</text>
    <text x="453" y="442" font-size="9.5" fill="#FFFFFF">signature · stamp · CMVP / equivalent ID</text>
    <text x="453" y="454" font-size="9.5" fill="#FFFFFF">issuance date — clock starts here</text>
  </g>

  
  <line x1="40" y1="495" x2="760" y2="495" stroke="#000000" stroke-width="0.6"></line>
  <text x="40" y="515" font-size="9.5" fill="#000000" font-weight="bold">Critical —</text>
  <text x="92" y="515" font-size="9.5" fill="#000000">Any missing block, microchip-document mismatch, or excursion beyond the 10-day window invalidates the AHC and triggers re-issuance.</text>
  <text x="40" y="530" font-size="9.5" fill="#666666" font-style="italic">Praziquantel must be vet-administered; owner self-administration is not accepted by APHA.</text>

  
  <text x="40" y="560" font-size="9" fill="#666666">Actors —</text>
  <circle cx="92" cy="557" r="6" fill="#1A5276" stroke="#000000" stroke-width="0.4"></circle>
  <text x="103" y="560" font-size="9" fill="#000000">Official veterinarian (origin)</text>
  <circle cx="270" cy="557" r="6" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"></circle>
  <text x="281" y="560" font-size="9" fill="#000000">APHA endorser / UK border officer</text>

  
  <text x="760" y="592" font-size="8.5" fill="#666666" text-anchor="end">© Jessica Y. Camacho Garcia, MVZ — CMVP 12434 | Zoovet Travel — Technical Series Vol. XIV | zoovettravel.com | 2026</text>
</svg>