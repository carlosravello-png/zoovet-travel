<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" font-family="Times New Roman, serif">
  <title>Figure 2. CDC canine-rabies country risk categories for dog importation (2024).</title>
  <desc>Schematic world map showing the three CDC country risk categories that drive distinct documentary requirement sets under the 2024 Interim Final Rule: high-risk for canine rabies (e.g., Peru, most of Africa and Asia), low-risk / rabies-free with valid Certificate of Vaccination, and rabies-free with no canine rabies enzootic. Boundaries are schematic and not drawn to cartographic precision.</desc>

  <rect width="800" height="600" fill="#FFFFFF"></rect>

  
  <line x1="40" y1="60" x2="760" y2="60" stroke="#000000" stroke-width="1"></line>
  <text x="40" y="42" font-size="13" font-weight="bold" fill="#000000">Figure 2.</text>
  <text x="100" y="42" font-size="13" fill="#000000">CDC country risk classification for dog importation to the United States (2024).</text>
  <text x="40" y="76" font-size="9.5" font-style="italic" fill="#666666">Schematic categorical map. Source: CDC list of high-risk countries for dog rabies (current at publication). Verify the live list at cdc.gov before each export.</text>

  
  <rect x="40" y="95" width="540" height="410" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"></rect>

  
  <g stroke="#666666" stroke-width="0.3" stroke-dasharray="2,3" opacity="0.4">
    <line x1="40" y1="200" x2="580" y2="200"></line>
    <line x1="40" y1="300" x2="580" y2="300"></line>
    <line x1="40" y1="400" x2="580" y2="400"></line>
    <line x1="175" y1="95" x2="175" y2="505"></line>
    <line x1="310" y1="95" x2="310" y2="505"></line>
    <line x1="445" y1="95" x2="445" y2="505"></line>
  </g>

  
  

  
  
  <path d="M 70,140 L 200,135 L 240,165 L 230,200 L 130,205 L 75,180 Z" fill="#FFFFFF" stroke="#000000" stroke-width="0.9"></path>
  <text x="155" y="170" font-size="9" text-anchor="middle" fill="#000000">Canada</text>

  
  <path d="M 90,205 L 230,205 L 235,250 L 100,255 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"></path>
  <text x="160" y="232" font-size="9.5" text-anchor="middle" fill="#000000" font-weight="bold">United States</text>
  <text x="160" y="244" font-size="8" text-anchor="middle" fill="#666666" font-style="italic">(destination)</text>

  
  <path d="M 100,255 L 235,250 L 220,285 L 165,300 L 115,285 Z" fill="#1A5276" stroke="#000000" stroke-width="0.9"></path>
  <text x="168" y="278" font-size="9" text-anchor="middle" fill="#FFFFFF">Mexico</text>

  
  <path d="M 165,300 L 215,295 L 220,320 L 180,325 Z" fill="#1A5276" stroke="#000000" stroke-width="0.7"></path>
  <text x="195" y="316" font-size="7.5" text-anchor="middle" fill="#FFFFFF">C. Am.</text>

  
  
  <path d="M 200,325 L 260,330 L 275,380 L 270,440 L 240,475 L 215,470 L 200,420 L 195,370 Z" fill="#1A5276" stroke="#000000" stroke-width="0.9"></path>
  
  <path d="M 205,365 L 230,365 L 232,400 L 210,405 Z" fill="#1A5276" stroke="#000000" stroke-width="1.8"></path>
  <text x="222" y="386" font-size="8.5" text-anchor="middle" fill="#FFFFFF" font-weight="bold">Peru</text>
  <text x="245" y="430" font-size="9" text-anchor="middle" fill="#FFFFFF">S. America</text>

  
  <line x1="232" y1="385" x2="285" y2="400" stroke="#000000" stroke-width="0.8"></line>
  <text x="290" y="403" font-size="9" fill="#000000" font-style="italic">origin (high-risk)</text>

  
  <path d="M 300,135 L 400,140 L 410,180 L 380,210 L 320,205 L 295,170 Z" fill="#FFFFFF" stroke="#000000" stroke-width="0.9"></path>
  <text x="350" y="180" font-size="9" text-anchor="middle" fill="#000000">Europe</text>
  <text x="350" y="194" font-size="7.5" text-anchor="middle" fill="#666666" font-style="italic">most: rabies-free</text>

  
  <path d="M 400,140 L 530,135 L 545,180 L 510,210 L 410,180 Z" fill="#666666" stroke="#000000" stroke-width="0.9"></path>
  <text x="475" y="180" font-size="9" text-anchor="middle" fill="#FFFFFF">Russia / E. Europe</text>

  
  <path d="M 320,210 L 410,215 L 430,290 L 410,370 L 365,410 L 320,395 L 305,330 L 305,255 Z" fill="#1A5276" stroke="#000000" stroke-width="0.9"></path>
  <text x="365" y="320" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="bold">Africa</text>
  <text x="365" y="335" font-size="8" text-anchor="middle" fill="#FFFFFF">canine rabies enzootic</text>

  
