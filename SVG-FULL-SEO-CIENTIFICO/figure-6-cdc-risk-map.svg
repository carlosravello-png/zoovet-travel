  <ellipse cx="555" cy="240" rx="13" ry="7" fill="#FFFFFF" stroke="#000000" stroke-width="0.9"></ellipse>
  <text x="555" y="243" font-size="7.5" text-anchor="middle" fill="#000000">Japan</text>

  
