  <text x="565" y="448" font-size="7.5" text-anchor="middle" fill="#000000">NZ</text>

  
  <g transform="translate(595,95)">
    <rect x="0" y="0" width="165" height="410" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"></rect>
    <text x="82" y="20" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">RISK CATEGORIES</text>
    <line x1="10" y1="28" x2="155" y2="28" stroke="#000000" stroke-width="0.6"></line>

    
    <rect x="10" y="40" width="20" height="14" fill="#1A5276" stroke="#000000" stroke-width="0.6"></rect>
    <text x="36" y="51" font-size="10" font-weight="bold" fill="#000000">High-risk</text>
    <text x="10" y="70" font-size="9" fill="#000000">Canine rabies enzootic.</text>
    <text x="10" y="83" font-size="9" fill="#000000">Microchip + rabies vax</text>
    <text x="10" y="96" font-size="9" fill="#000000">+ RFFIT ≥ 0.5 IU/mL</text>
    <text x="10" y="109" font-size="9" fill="#000000">(USDA-approved lab)</text>
    <text x="10" y="122" font-size="9" fill="#000000">+ APHIS Form 7001</text>
    <text x="10" y="135" font-size="9" fill="#000000">+ DogBot ≥ 6 mo old.</text>
    <text x="10" y="152" font-size="9" font-style="italic" fill="#666666">Peru is in this group.</text>

    <line x1="10" y1="168" x2="155" y2="168" stroke="#666666" stroke-width="0.4"></line>

    
    <rect x="10" y="178" width="20" height="14" fill="#666666" stroke="#000000" stroke-width="0.6"></rect>
    <text x="36" y="189" font-size="10" font-weight="bold" fill="#000000">Low-risk</text>
    <text x="10" y="208" font-size="9" fill="#000000">No enzootic canine</text>
    <text x="10" y="221" font-size="9" fill="#000000">rabies but adjacent</text>
    <text x="10" y="234" font-size="9" fill="#000000">to endemic regions.</text>
    <text x="10" y="251" font-size="9" fill="#000000">Microchip + valid</text>
    <text x="10" y="264" font-size="9" fill="#000000">rabies vaccination</text>
    <text x="10" y="277" font-size="9" fill="#000000">(no RFFIT required).</text>

    <line x1="10" y1="290" x2="155" y2="290" stroke="#666666" stroke-width="0.4"></line>

    
    <rect x="10" y="300" width="20" height="14" fill="#FFFFFF" stroke="#000000" stroke-width="0.9"></rect>
    <text x="36" y="311" font-size="10" font-weight="bold" fill="#000000">Rabies-free</text>
    <text x="10" y="330" font-size="9" fill="#000000">No canine rabies for</text>
    <text x="10" y="343" font-size="9" fill="#000000">≥ 6 months and CDC-</text>
    <text x="10" y="356" font-size="9" fill="#000000">listed as free.</text>
    <text x="10" y="373" font-size="9" fill="#000000">Microchip + valid</text>
    <text x="10" y="386" font-size="9" fill="#000000">vaccination OR proof</text>
    <text x="10" y="399" font-size="9" fill="#000000">of free-country origin.</text>
  </g>

  
  <line x1="40" y1="525" x2="760" y2="525" stroke="#000000" stroke-width="0.6"></line>
  <text x="40" y="545" font-size="9.5" fill="#000000" font-weight="bold">Note —</text>
  <text x="88" y="545" font-size="9.5" fill="#000000">No Peruvian laboratory currently holds USDA-approval status for RFFIT; serum must be shipped to a CDC/USDA-recognised lab abroad.</text>
  <text x="40" y="560" font-size="9.5" fill="#666666" font-style="italic">Country list is dynamic. Verify cdc.gov/importation/dogs/high-risk-countries.html before each export. Map is schematic, not cartographically accurate.</text>

  
