<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" font-family="Times New Roman, serif">
  <title>Figure 1. Decision flowchart for international pet vaccination certificate validity.</title>
  <desc>Sequential decision tree showing the five branching conditions whose simultaneous fulfilment is required for the rabies vaccination certificate to be admissible at the destination border (ISO microchip prior to vaccination, ≥21-day primary-vaccination waiting period, ≥30-day RNATT sampling interval, ≥0.5 IU/mL titre, destination-specific format and signatures).</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"></path>
    </marker>
    <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1A5276"></path>
    </marker>
  </defs>

  <rect width="600" height="800" fill="#FFFFFF"></rect>

  
  <line x1="40" y1="60" x2="560" y2="60" stroke="#000000" stroke-width="1"></line>
  <text x="40" y="42" font-size="13" font-weight="bold" fill="#000000">Figure 1.</text>
  <text x="100" y="42" font-size="13" fill="#000000">Decision flowchart — certificate validity for international pet movement.</text>
  <text x="40" y="76" font-size="9.5" font-style="italic" fill="#666666">Sequential AND-logic: every condition must hold; any single failure invalidates the whole documentary chain. Adapted from EU Reg. 576/2013, UK APHA, AU DAFF, NZ MPI (CATDOG.GEN).</text>

  
  <g>
    <rect x="220" y="95" width="160" height="34" fill="#1A5276" stroke="#000000" stroke-width="1"></rect>
    <text x="300" y="117" font-size="12" text-anchor="middle" fill="#FFFFFF" font-weight="bold">START — Pet to be exported</text>
  </g>
  <line x1="300" y1="129" x2="300" y2="150" stroke="#000000" stroke-width="1.2" marker-end="url(#arr)"></line>

  
  <g>
    <polygon points="300,156 410,206 300,256 190,206" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"></polygon>
    <text x="300" y="200" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">ISO microchip implanted</text>
    <text x="300" y="214" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">BEFORE rabies vaccine?</text>
    <text x="300" y="228" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">(ISO 11784/11785)</text>
  </g>
  
  <line x1="410" y1="206" x2="500" y2="206" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="455" y="200" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">NO</text>
  
  <line x1="300" y1="256" x2="300" y2="285" stroke="#1A5276" stroke-width="1.4" marker-end="url(#arrAcc)"></line>
  <text x="312" y="275" font-size="10" fill="#1A5276" font-weight="bold">YES</text>

  
  <g>
    <polygon points="300,290 410,335 300,380 190,335" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"></polygon>
    <text x="300" y="330" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">≥ 21 days since</text>
    <text x="300" y="344" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">primary vaccination?</text>
    <text x="300" y="358" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">(EU 576/2013)</text>
  </g>
  <line x1="410" y1="335" x2="500" y2="335" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="455" y="329" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">NO</text>
  <line x1="300" y1="380" x2="300" y2="410" stroke="#1A5276" stroke-width="1.4" marker-end="url(#arrAcc)"></line>
  <text x="312" y="400" font-size="10" fill="#1A5276" font-weight="bold">YES</text>

  
  <g>
    <polygon points="300,415 410,460 300,505 190,460" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"></polygon>
    <text x="300" y="452" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">Destination requires</text>
    <text x="300" y="466" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">RNATT serology?</text>
    <text x="300" y="480" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">(UK · AU · NZ · JP)</text>
  </g>
  
  <line x1="190" y1="460" x2="105" y2="460" stroke="#000000" stroke-width="1"></line>
  <line x1="105" y1="460" x2="105" y2="660" stroke="#000000" stroke-width="1"></line>
  <line x1="105" y1="660" x2="155" y2="660" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="148" y="453" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">NO</text>
  
  <line x1="300" y1="505" x2="300" y2="535" stroke="#1A5276" stroke-width="1.4" marker-end="url(#arrAcc)"></line>
  <text x="312" y="525" font-size="10" fill="#1A5276" font-weight="bold">YES</text>

  
  <g>
    <polygon points="300,540 415,590 300,640 185,590" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"></polygon>
    <text x="300" y="580" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">Sample ≥ 30 d post-vax</text>
    <text x="300" y="594" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">AND titre ≥ 0.5 IU/mL?</text>
    <text x="300" y="608" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">(WOAH-accredited lab)</text>
  </g>
  <line x1="415" y1="590" x2="500" y2="590" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="458" y="584" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">NO</text>
  <line x1="300" y1="640" x2="300" y2="660" stroke="#1A5276" stroke-width="1.4"></line>
  <text x="312" y="655" font-size="10" fill="#1A5276" font-weight="bold">YES</text>

  
  <g>
    <rect x="155" y="660" width="290" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"></rect>
    <text x="300" y="678" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">Destination-specific format,</text>
    <text x="300" y="694" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">batch, signature &amp; stamp valid?</text>
  </g>
  
  <line x1="445" y1="682" x2="500" y2="682" stroke="#000000" stroke-width="1"></line>
  <line x1="500" y1="682" x2="500" y2="380" stroke="#000000" stroke-width="1"></line>
  <line x1="500" y1="380" x2="500" y2="380" stroke="#000000" stroke-width="1"></line>
  <line x1="500" y1="206" x2="500" y2="335" stroke="#000000" stroke-width="0"></line>
  

  
  <g>
    <rect x="478" y="180" width="100" height="200" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"></rect>
    <text x="528" y="208" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">CERTIFICATE</text>
    <text x="528" y="224" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">INVALID</text>
    <line x1="490" y1="234" x2="566" y2="234" stroke="#000000" stroke-width="0.6"></line>
    <text x="528" y="252" font-size="9" text-anchor="middle" fill="#000000">Restart protocol</text>
    <text x="528" y="266" font-size="9" text-anchor="middle" fill="#000000">from failed step.</text>
    <text x="528" y="288" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">Microchip error</text>
    <text x="528" y="300" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">= 21-d wait restart</text>
    <text x="528" y="312" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">+ new RNATT</text>
    <text x="528" y="334" font-size="9" text-anchor="middle" fill="#000000">Border refusal,</text>
    <text x="528" y="346" font-size="9" text-anchor="middle" fill="#000000">quarantine or</text>
    <text x="528" y="358" font-size="9" text-anchor="middle" fill="#000000">return shipment.</text>
  </g>

  
  <line x1="500" y1="206" x2="500" y2="335" stroke="#000000" stroke-width="0.8" stroke-dasharray="0"></line>
  <line x1="500" y1="335" x2="500" y2="590" stroke="#000000" stroke-width="0.8"></line>
  <line x1="500" y1="206" x2="478" y2="206" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>

  
  <line x1="300" y1="704" x2="300" y2="725" stroke="#1A5276" stroke-width="1.6" marker-end="url(#arrAcc)"></line>
  <text x="312" y="720" font-size="10" fill="#1A5276" font-weight="bold">YES</text>
  <g>
    <rect x="170" y="730" width="260" height="38" fill="#1A5276" stroke="#000000" stroke-width="1"></rect>
    <text x="300" y="754" font-size="13" text-anchor="middle" fill="#FFFFFF" font-weight="bold">CERTIFICATE VALID — entry permitted</text>
  </g>

  
  <text x="560" y="788" font-size="8" fill="#666666" text-anchor="end">© Jessica Y. Camacho Garcia, MVZ — CMVP 12434 | Zoovet Travel Technical Series Vol. IX | zoovettravel.com | 2026</text>
</svg>