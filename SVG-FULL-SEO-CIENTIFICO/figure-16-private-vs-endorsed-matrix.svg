<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" font-family="Times New Roman, serif">
  <title>Figure 2. Private veterinary certificate vs. officially endorsed certificate — comparative matrix by jurisdiction.</title>
  <desc>Matrix comparing the two document types (private veterinary certificate and officially endorsed state certificate) across four jurisdictions (EU under Reg. 576/2013, UK under APHA Pet Travel Scheme, Australia under DAFF, New Zealand under MPI CATDOG.GEN), with attributes covering emitter credentials, endorsement mechanism, model document and temporal window.</desc>

  <rect width="800" height="600" fill="#FFFFFF"></rect>

  
  <line x1="40" y1="60" x2="760" y2="60" stroke="#000000" stroke-width="1"></line>
  <text x="40" y="42" font-size="13" font-weight="bold" fill="#000000">Figure 2.</text>
  <text x="100" y="42" font-size="13" fill="#000000">Private veterinary certificate vs. officially endorsed certificate — comparative matrix.</text>
  <text x="40" y="76" font-size="9.5" font-style="italic" fill="#666666">Synthesis of EU Reg. 576/2013, UK APHA AHC scheme, AU DAFF, NZ MPI. Direct verification with each authority is required before emission.</text>

  
  <g>
    <rect x="40" y="95" width="160" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"></rect>
    <text x="50" y="118" font-size="11" font-weight="bold" fill="#000000">Attribute</text>

    <rect x="200" y="95" width="280" height="36" fill="#666666" stroke="#000000" stroke-width="1"></rect>
    <text x="340" y="113" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="bold">Private veterinary certificate</text>
    <text x="340" y="125" font-size="9" text-anchor="middle" fill="#FFFFFF" font-style="italic">individual professional responsibility</text>

    <rect x="480" y="95" width="280" height="36" fill="#1A5276" stroke="#000000" stroke-width="1"></rect>
    <text x="620" y="113" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="bold">Officially endorsed certificate</text>
    <text x="620" y="125" font-size="9" text-anchor="middle" fill="#FFFFFF" font-style="italic">state-level authority document</text>
  </g>

  
  <g>
    <rect x="40" y="131" width="160" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"></rect>
    <text x="50" y="152" font-size="11" font-weight="bold" fill="#000000">European Union</text>
    <text x="50" y="166" font-size="9.5" fill="#666666" font-style="italic">Reg. (EU) 576/2013</text>
    <text x="50" y="182" font-size="9" fill="#666666">Intra-EU + third country</text>
    <text x="50" y="194" font-size="9" fill="#666666">routes</text>

    <rect x="200" y="131" width="280" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"></rect>
    <text x="210" y="150" font-size="10" font-weight="bold" fill="#000000">Status:</text>
    <text x="270" y="150" font-size="10" fill="#000000">Insufficient for third-country entry</text>
    <text x="210" y="166" font-size="10" font-weight="bold" fill="#000000">Emitter:</text>
    <text x="270" y="166" font-size="10" fill="#000000">Any habilitated private vet</text>
    <text x="210" y="182" font-size="10" font-weight="bold" fill="#000000">Use:</text>
    <text x="270" y="182" font-size="10" fill="#000000">Pre-export clinical screening only</text>
    <text x="210" y="200" font-size="9" fill="#666666" font-style="italic">Border officer requires endorsed version</text>

    <rect x="480" y="131" width="280" height="80" fill="#FFFFFF" stroke="#1A5276" stroke-width="1.2"></rect>
    <text x="490" y="150" font-size="10" font-weight="bold" fill="#000000">Model:</text>
    <text x="540" y="150" font-size="10" fill="#1A5276" font-weight="bold">Impl. Reg. 577/2013 Annex IV</text>
    <text x="490" y="166" font-size="10" font-weight="bold" fill="#000000">Emitter:</text>
    <text x="540" y="166" font-size="10" fill="#000000">Official veterinarian (state)</text>
    <text x="490" y="182" font-size="10" font-weight="bold" fill="#000000">Window:</text>
    <text x="540" y="182" font-size="10" fill="#000000">≤ 10 d before entry</text>
    <text x="490" y="200" font-size="9" fill="#666666" font-style="italic">In Peru: SENASA-accredited official vet</text>
  </g>

  
  <g>
    <rect x="40" y="211" width="160" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"></rect>
    <text x="50" y="232" font-size="11" font-weight="bold" fill="#000000">United Kingdom</text>
    <text x="50" y="246" font-size="9.5" fill="#666666" font-style="italic">APHA / DEFRA Pet Travel</text>
    <text x="50" y="262" font-size="9" fill="#666666">Animal Health Certificate</text>
    <text x="50" y="274" font-size="9" fill="#666666">(AHC) — post-Brexit</text>

    <rect x="200" y="211" width="280" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"></rect>
    <text x="210" y="230" font-size="10" font-weight="bold" fill="#000000">Status:</text>
    <text x="270" y="230" font-size="10" fill="#000000">Not accepted as AHC</text>
    <text x="210" y="246" font-size="10" font-weight="bold" fill="#000000">Emitter:</text>
    <text x="270" y="246" font-size="10" fill="#000000">Private vet — no OV status</text>
    <text x="210" y="262" font-size="10" font-weight="bold" fill="#000000">Use:</text>
    <text x="270" y="262" font-size="10" fill="#000000">Internal clinical documentation</text>
    <text x="210" y="280" font-size="9" fill="#666666" font-style="italic">AHC reserved to APHA-habilitated OVs</text>

    <rect x="480" y="211" width="280" height="80" fill="#FFFFFF" stroke="#1A5276" stroke-width="1.2"></rect>
    <text x="490" y="230" font-size="10" font-weight="bold" fill="#000000">Model:</text>
    <text x="540" y="230" font-size="10" fill="#1A5276" font-weight="bold">Animal Health Certificate</text>
    <text x="490" y="246" font-size="10" font-weight="bold" fill="#000000">Emitter:</text>
    <text x="540" y="246" font-size="10" fill="#000000">Official Veterinarian (OV)</text>
    <text x="490" y="262" font-size="10" font-weight="bold" fill="#000000">Window:</text>
    <text x="540" y="262" font-size="10" fill="#000000">≤ 10 d before entry, single use</text>
    <text x="490" y="280" font-size="9" fill="#666666" font-style="italic">OV credential issued by APHA</text>
  </g>

  
  <g>
    <rect x="40" y="291" width="160" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"></rect>
    <text x="50" y="312" font-size="11" font-weight="bold" fill="#000000">Australia</text>
    <text x="50" y="326" font-size="9.5" fill="#666666" font-style="italic">DAFF Biosecurity Act</text>
    <text x="50" y="342" font-size="9" fill="#666666">Import permit + Health</text>
    <text x="50" y="354" font-size="9" fill="#666666">Certificate per group</text>

    <rect x="200" y="291" width="280" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"></rect>
    <text x="210" y="310" font-size="10" font-weight="bold" fill="#000000">Status:</text>
    <text x="270" y="310" font-size="10" fill="#000000">Not accepted alone</text>
    <text x="210" y="326" font-size="10" font-weight="bold" fill="#000000">Emitter:</text>
    <text x="270" y="326" font-size="10" fill="#000000">Private vet</text>
    <text x="210" y="342" font-size="10" font-weight="bold" fill="#000000">Use:</text>
    <text x="270" y="342" font-size="10" fill="#000000">Pre-RFFIT and pre-protocol</text>
    <text x="210" y="360" font-size="9" fill="#666666" font-style="italic">Requires official certification chain</text>

    <rect x="480" y="291" width="280" height="80" fill="#FFFFFF" stroke="#1A5276" stroke-width="1.2"></rect>
    <text x="490" y="310" font-size="10" font-weight="bold" fill="#000000">Model:</text>
    <text x="540" y="310" font-size="10" fill="#1A5276" font-weight="bold">Group-specific veterinary cert.</text>
    <text x="490" y="326" font-size="10" font-weight="bold" fill="#000000">Emitter:</text>
    <text x="540" y="326" font-size="10" fill="#000000">Government-approved vet</text>
    <text x="490" y="342" font-size="10" font-weight="bold" fill="#000000">Window:</text>
    <text x="540" y="342" font-size="10" fill="#000000">≤ 5 d before export</text>
    <text x="490" y="360" font-size="9" fill="#666666" font-style="italic">+ import permit issued in advance</text>
  </g>

  
  <g>
    <rect x="40" y="371" width="160" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"></rect>
    <text x="50" y="392" font-size="11" font-weight="bold" fill="#000000">New Zealand</text>
    <text x="50" y="406" font-size="9.5" fill="#666666" font-style="italic">MPI · IHS CATDOG.GEN</text>
    <text x="50" y="422" font-size="9" fill="#666666">Import Health Standard</text>
    <text x="50" y="434" font-size="9" fill="#666666">veterinary certificate</text>

    <rect x="200" y="371" width="280" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"></rect>
    <text x="210" y="390" font-size="10" font-weight="bold" fill="#000000">Status:</text>
    <text x="270" y="390" font-size="10" fill="#000000">Not accepted alone</text>
    <text x="210" y="406" font-size="10" font-weight="bold" fill="#000000">Emitter:</text>
    <text x="270" y="406" font-size="10" fill="#000000">Private vet</text>
    <text x="210" y="422" font-size="10" font-weight="bold" fill="#000000">Use:</text>
    <text x="270" y="422" font-size="10" fill="#000000">Pre-protocol clinical record</text>
    <text x="210" y="440" font-size="9" fill="#666666" font-style="italic">Official certification mandated by IHS</text>

    <rect x="480" y="371" width="280" height="80" fill="#FFFFFF" stroke="#1A5276" stroke-width="1.2"></rect>
    <text x="490" y="390" font-size="10" font-weight="bold" fill="#000000">Model:</text>
    <text x="540" y="390" font-size="10" fill="#1A5276" font-weight="bold">MPI veterinary certificate</text>
    <text x="490" y="406" font-size="10" font-weight="bold" fill="#000000">Emitter:</text>
    <text x="540" y="406" font-size="10" fill="#000000">Official vet (country of origin)</text>
    <text x="490" y="422" font-size="10" font-weight="bold" fill="#000000">Window:</text>
    <text x="540" y="422" font-size="10" fill="#000000">≤ 5 d before export</text>
    <text x="490" y="440" font-size="9" fill="#666666" font-style="italic">+ pre-issued MPI import permit</text>
  </g>

  
  <g>
    <rect x="40" y="463" width="720" height="62" fill="#FFFFFF" stroke="#000000" stroke-width="0.6"></rect>
    <text x="50" y="481" font-size="11" font-weight="bold" fill="#000000">Convergent rule —</text>
    <text x="180" y="481" font-size="10.5" fill="#000000">in every analysed jurisdiction, the private veterinary certificate is necessary but not sufficient.</text>
    <text x="50" y="498" font-size="10.5" fill="#000000">The state endorsement (or its functional equivalent under EU and UK schemes, where the emitter must already hold official status) is the document</text>
    <text x="50" y="514" font-size="10.5" fill="#000000">that the border officer accepts. In Peru, the official veterinarian for export is the SENASA-accredited veterinarian.</text>
  </g>

  
  <g transform="translate(40,545)" font-size="10" fill="#000000">
    <rect x="0" y="-9" width="14" height="9" fill="#666666"></rect>
    <text x="20" y="-1">Private veterinary certificate</text>
    <rect x="220" y="-9" width="14" height="9" fill="#1A5276"></rect>
    <text x="240" y="-1">Officially endorsed certificate (border-grade)</text>
  </g>

  
  <text x="760" y="592" font-size="8.5" fill="#666666" text-anchor="end">© Jessica Y. Camacho Garcia, MVZ — CMVP 12434 | Zoovet Travel — Technical Series Vol. X | zoovettravel.com | 2026</text>
</svg>