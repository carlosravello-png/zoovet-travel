<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" font-family="Times New Roman, serif">
  <title>Figure 2. Technical causes that trigger or extend quarantine on arrival.</title>
  <desc>Cause-and-effect flowchart of the six most frequent technical failure modes at the border (illegible or mismatched microchip; vaccine-serology chronology error; parasiticide treatment outside window; ectoparasites detected on arrival; documentary inconsistency; clinical signs on inspection) and their downstream consequences (retention, quarantine extension, re-export).</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"></path>
    </marker>
    <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1A5276"></path>
    </marker>
  </defs>

  <rect width="600" height="800" fill="#FFFFFF"></rect>

  
  <line x1="40" y1="60" x2="560" y2="60" stroke="#000000" stroke-width="1"></line>
  <text x="40" y="42" font-size="13" font-weight="bold" fill="#000000">Figure 2.</text>
  <text x="100" y="42" font-size="13" fill="#000000">Technical causes that trigger or extend quarantine.</text>
  <text x="40" y="76" font-size="9.5" font-style="italic" fill="#666666">Adapted from Reg. (EU) 576/2013 art. 35, MPI CATDOG.GEN, DAFF PEQ standard and CDC Dog Import Rule. Each cause is independent and any single failure suffices.</text>

  
  <rect x="180" y="92" width="240" height="32" fill="#1A5276" stroke="#000000" stroke-width="1"></rect>
  <text x="300" y="113" font-size="12" text-anchor="middle" fill="#FFFFFF" font-weight="bold">ARRIVAL — border veterinary check</text>

  
  <line x1="300" y1="124" x2="300" y2="690" stroke="#000000" stroke-width="0.8"></line>

  
  

  

  
  <rect x="40" y="138" width="220" height="64" fill="#FFFFFF" stroke="#000000" stroke-width="1"></rect>
  <text x="50" y="156" font-size="10.5" font-weight="bold" fill="#1A5276">C1 — Microchip illegible or</text>
  <text x="50" y="170" font-size="10.5" font-weight="bold" fill="#1A5276">mismatched with documents</text>
  <text x="50" y="186" font-size="9.5" fill="#000000">Single-digit divergence is sufficient.</text>
  <text x="50" y="198" font-size="9.5" fill="#666666" font-style="italic">→ identity unverified</text>
  <line x1="260" y1="170" x2="296" y2="170" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <circle cx="300" cy="170" r="4" fill="#1A5276"></circle>

  
  <rect x="340" y="218" width="220" height="64" fill="#FFFFFF" stroke="#000000" stroke-width="1"></rect>
  <text x="350" y="236" font-size="10.5" font-weight="bold" fill="#1A5276">C2 — Vaccine–RNATT</text>
  <text x="350" y="250" font-size="10.5" font-weight="bold" fill="#1A5276">chronology error</text>
  <text x="350" y="266" font-size="9.5" fill="#000000">Sample &lt; 30 d post-vaccine.</text>
  <text x="350" y="278" font-size="9.5" fill="#666666" font-style="italic">→ serology not recognised</text>
  <line x1="340" y1="250" x2="304" y2="250" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <circle cx="300" cy="250" r="4" fill="#1A5276"></circle>

  
  <rect x="40" y="298" width="220" height="64" fill="#FFFFFF" stroke="#000000" stroke-width="1"></rect>
  <text x="50" y="316" font-size="10.5" font-weight="bold" fill="#1A5276">C3 — Parasiticide outside</text>
  <text x="50" y="330" font-size="10.5" font-weight="bold" fill="#1A5276">required time window</text>
  <text x="50" y="346" font-size="9.5" fill="#000000">Praziquantel before / after window</text>
  <text x="50" y="358" font-size="9.5" fill="#666666" font-style="italic">→ treatment not recognised (UK/AU/NZ)</text>
  <line x1="260" y1="330" x2="296" y2="330" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <circle cx="300" cy="330" r="4" fill="#1A5276"></circle>

  
  <rect x="340" y="378" width="220" height="64" fill="#FFFFFF" stroke="#000000" stroke-width="1"></rect>
  <text x="350" y="396" font-size="10.5" font-weight="bold" fill="#1A5276">C4 — Ectoparasites detected</text>
  <text x="350" y="410" font-size="10.5" font-weight="bold" fill="#1A5276">on arrival inspection</text>
  <text x="350" y="426" font-size="9.5" fill="#000000">Ticks / fleas at PEQ intake.</text>
  <text x="350" y="438" font-size="9.5" fill="#666666" font-style="italic">→ frequent extension (AU/NZ)</text>
  <line x1="340" y1="410" x2="304" y2="410" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <circle cx="300" cy="410" r="4" fill="#1A5276"></circle>

  
  <rect x="40" y="458" width="220" height="64" fill="#FFFFFF" stroke="#000000" stroke-width="1"></rect>
  <text x="50" y="476" font-size="10.5" font-weight="bold" fill="#1A5276">C5 — Internal documentary</text>
  <text x="50" y="490" font-size="10.5" font-weight="bold" fill="#1A5276">inconsistency</text>
  <text x="50" y="506" font-size="9.5" fill="#000000">Names, dates, batches diverge across</text>
  <text x="50" y="518" font-size="9.5" fill="#000000">cert / RNATT / vaccine record.</text>
  <line x1="260" y1="490" x2="296" y2="490" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <circle cx="300" cy="490" r="4" fill="#1A5276"></circle>

  
  <rect x="340" y="538" width="220" height="64" fill="#FFFFFF" stroke="#000000" stroke-width="1"></rect>
  <text x="350" y="556" font-size="10.5" font-weight="bold" fill="#1A5276">C6 — Clinical signs at</text>
  <text x="350" y="570" font-size="10.5" font-weight="bold" fill="#1A5276">border inspection</text>
  <text x="350" y="586" font-size="9.5" fill="#000000">Diarrhoea, lethargy, respiratory signs,</text>
  <text x="350" y="598" font-size="9.5" fill="#000000">fever or behavioural changes.</text>
  <line x1="340" y1="570" x2="304" y2="570" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <circle cx="300" cy="570" r="4" fill="#1A5276"></circle>

  
  <line x1="300" y1="690" x2="300" y2="710" stroke="#1A5276" stroke-width="1.6" marker-end="url(#arrAcc)"></line>

  
  <g>
    <rect x="40" y="715" width="160" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1"></rect>
    <text x="120" y="734" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">RETENTION</text>
    <text x="120" y="750" font-size="9.5" text-anchor="middle" fill="#000000">Hold until issue resolved.</text>
    <text x="120" y="763" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">Hours to days.</text>

    <rect x="220" y="715" width="160" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1"></rect>
    <text x="300" y="734" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">EXTENDED PEQ</text>
    <text x="300" y="750" font-size="9.5" text-anchor="middle" fill="#000000">Quarantine prolonged.</text>
    <text x="300" y="763" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">Days to months.</text>

    <rect x="400" y="715" width="160" height="60" fill="#1A5276" stroke="#000000" stroke-width="1"></rect>
    <text x="480" y="734" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="bold">RE-EXPORT</text>
    <text x="480" y="750" font-size="9.5" text-anchor="middle" fill="#FFFFFF">Animal returned to origin.</text>
    <text x="480" y="763" font-size="9" text-anchor="middle" fill="#FFFFFF" font-style="italic">Euthanasia last resort.</text>
  </g>

  
  <line x1="120" y1="710" x2="120" y2="713" stroke="#000000" stroke-width="0.8"></line>
  <line x1="480" y1="710" x2="480" y2="713" stroke="#000000" stroke-width="0.8"></line>
  <line x1="120" y1="710" x2="480" y2="710" stroke="#000000" stroke-width="0.8"></line>

  
  <text x="560" y="788" font-size="8" fill="#666666" text-anchor="end">© Jessica Y. Camacho Garcia, MVZ — CMVP 12434 | Zoovet Travel — Technical Series Vol. XI | zoovettravel.com | 2026</text>
</svg>