<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" font-family="Times New Roman, serif">
  <title>Figure 2. Regulatory timeline from primary rabies vaccination to international movement.</title>
  <desc>Horizontal timeline showing administrative validity (day 21), the mandatory serology sampling gate (day ≥30, RFFIT/FAVN, ≥0.5 IU/mL), and jurisdiction-specific post-titre waiting periods for entry into the EU, UK, US, Australia and Japan.</desc>

  <rect width="800" height="600" fill="#FFFFFF"></rect>

  
  <line x1="50" y1="60" x2="750" y2="60" stroke="#000000" stroke-width="1"></line>
  <text x="50" y="44" font-size="14" fill="#000000" font-weight="bold">Figure 2.</text>
  <text x="110" y="44" font-size="14" fill="#000000">Regulatory timeline: from primary rabies vaccination to international movement.</text>
  <text x="50" y="78" font-size="10" fill="#666666" font-style="italic">Synthesis of EU Reg. 576/2013, US CDC (Aug 2024), UK APHA, AU DAWR-BICON and JP AQS-MAFF requirements for dogs from non-listed third countries (e.g., Peru).</text>

  
  <line x1="80" y1="200" x2="720" y2="200" stroke="#000000" stroke-width="1.6"></line>
  <polygon points="720,200 712,196 712,204" fill="#000000"></polygon>

  
  
  <g>
    <line x1="100" y1="190" x2="100" y2="210" stroke="#000000" stroke-width="1.4"></line>
    <text x="100" y="180" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">DAY 0</text>
    <text x="100" y="228" font-size="10" text-anchor="middle" fill="#000000">Microchip ISO</text>
    <text x="100" y="240" font-size="10" text-anchor="middle" fill="#000000">+ primary vaccine</text>
  </g>

  
  <g>
    <line x1="220" y1="190" x2="220" y2="210" stroke="#666666" stroke-width="1.2"></line>
    <text x="220" y="180" font-size="10" text-anchor="middle" fill="#666666" font-weight="bold">DAY 21</text>
    <text x="220" y="228" font-size="10" text-anchor="middle" fill="#666666">Administrative</text>
    <text x="220" y="240" font-size="10" text-anchor="middle" fill="#666666">validity</text>
    <text x="220" y="254" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">(NOT samplable)</text>
  </g>

  
  <g>
    <circle cx="320" cy="200" r="9" fill="#1A5276" stroke="#000000" stroke-width="1"></circle>
    <text x="320" y="180" font-size="11" text-anchor="middle" fill="#1A5276" font-weight="bold">DAY ≥ 30</text>
    <text x="320" y="232" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">RFFIT / FAVN</text>
    <text x="320" y="244" font-size="10" text-anchor="middle" fill="#000000">blood draw</text>
    <text x="320" y="258" font-size="10" text-anchor="middle" fill="#1A5276">≥ 0.5 IU/mL</text>
    <text x="320" y="272" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">earliest legal sampling</text>
  </g>

  
  <g>
    <line x1="430" y1="190" x2="430" y2="210" stroke="#000000" stroke-width="1.2"></line>
    <text x="430" y="180" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">+ 28 d</text>
  </g>

  
  <g>
    <line x1="540" y1="190" x2="540" y2="210" stroke="#000000" stroke-width="1.2"></line>
    <text x="540" y="180" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">+ 3 months</text>
  </g>

  
  <g>
    <line x1="680" y1="190" x2="680" y2="210" stroke="#000000" stroke-width="1.2"></line>
    <text x="680" y="180" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">+ 180 d</text>
    <text x="680" y="168" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">(after 2nd titre)</text>
  </g>

  
  <path d="M 100,124 L 100,118 L 320,118 L 320,124" fill="none" stroke="#1A5276" stroke-width="1"></path>
  <text x="210" y="110" font-size="10" text-anchor="middle" fill="#1A5276" font-style="italic">Regulatory protection window — sampling prohibited</text>

  
  <path d="M 320,278 L 320,284 L 700,284 L 700,278" fill="none" stroke="#666666" stroke-width="0.8"></path>
  <text x="510" y="298" font-size="10" text-anchor="middle" fill="#666666" font-style="italic">Sample valid up to 12 months (WOAH TAHC 8.14)</text>

  
  
  <g>
    <line x1="430" y1="210" x2="430" y2="340" stroke="#1A5276" stroke-width="1.2"></line>
    <line x1="430" y1="340" x2="630" y2="340" stroke="#1A5276" stroke-width="1.2"></line>
    <polygon points="630,340 622,336 622,344" fill="#1A5276"></polygon>
    <rect x="430" y="350" width="200" height="58" fill="#FFFFFF" stroke="#1A5276" stroke-width="1"></rect>
    <text x="440" y="368" font-size="11" fill="#1A5276" font-weight="bold">United States — CDC</text>
    <text x="440" y="382" font-size="10" fill="#000000">Entry ≥ 28 days after</text>
    <text x="440" y="394" font-size="10" fill="#000000">blood draw; titre valid for</text>
    <text x="440" y="406" font-size="10" fill="#000000">life if no coverage lapse.</text>
  </g>

  
  <g>
    <line x1="540" y1="210" x2="540" y2="430" stroke="#1A5276" stroke-width="1.2"></line>
    <line x1="540" y1="430" x2="180" y2="430" stroke="#1A5276" stroke-width="1.2"></line>
    <polygon points="180,430 188,426 188,434" fill="#1A5276"></polygon>
    <rect x="80" y="440" width="220" height="58" fill="#FFFFFF" stroke="#1A5276" stroke-width="1"></rect>
    <text x="90" y="458" font-size="11" fill="#1A5276" font-weight="bold">European Union · United Kingdom</text>
    <text x="90" y="472" font-size="10" fill="#000000">Movement ≥ 3 months after</text>
    <text x="90" y="484" font-size="10" fill="#000000">sample date (non-listed</text>
    <text x="90" y="496" font-size="10" fill="#000000">third countries — Reg. 576/2013).</text>
  </g>

  
  <g>
    <line x1="680" y1="210" x2="680" y2="430" stroke="#1A5276" stroke-width="1.2"></line>
    <line x1="680" y1="430" x2="430" y2="430" stroke="#1A5276" stroke-width="1.2"></line>
    <polygon points="430,430 438,426 438,434" fill="#1A5276"></polygon>
    <rect x="330" y="440" width="240" height="58" fill="#FFFFFF" stroke="#1A5276" stroke-width="1"></rect>
    <text x="340" y="458" font-size="11" fill="#1A5276" font-weight="bold">Australia (DAWR) · Japan (AQS)</text>
    <text x="340" y="472" font-size="10" fill="#000000">Two positive titres required;</text>
    <text x="340" y="484" font-size="10" fill="#000000">entry ≥ 180 days after 2nd titre,</text>
    <text x="340" y="496" font-size="10" fill="#000000">plus arrival quarantine.</text>
  </g>

  
  <g>
    <rect x="600" y="440" width="150" height="58" fill="#FFFFFF" stroke="#000000" stroke-width="0.6"></rect>
    <text x="608" y="458" font-size="10" fill="#000000" font-weight="bold">Coverage lapse</text>
    <text x="608" y="472" font-size="9.5" fill="#000000">= new primary vaccination.</text>
    <text x="608" y="484" font-size="9.5" fill="#000000">Sample again at ≥ 30 d</text>
    <text x="608" y="496" font-size="9.5" fill="#000000">post-new dose (CDC, 2024).</text>
  </g>

  
  <g>
    <line x1="50" y1="535" x2="750" y2="535" stroke="#000000" stroke-width="0.6"></line>
    <text x="50" y="552" font-size="10" fill="#000000" font-weight="bold">Dual-risk control at d ≥ 30:</text>
    <text x="180" y="552" font-size="10" fill="#000000">Type A — pre-vaccination incubation excluded by elapsed time;</text>
    <text x="180" y="565" font-size="10" fill="#000000">Type B — insufficient response minimised as primary kinetics plateau (Smith et al., 2021).</text>
  </g>

  
  <text x="750" y="588" font-size="8.5" fill="#666666" text-anchor="end">© Jessica Y. Camacho Garcia, MVZ — CMVP 12434 | Zoovet Travel Technical Series Vol. I | zoovettravel.com | 2026</text>
</svg>