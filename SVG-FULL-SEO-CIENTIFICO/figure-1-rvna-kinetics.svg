<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" font-family="Times New Roman, serif">
  <title>Figure 1. Kinetics of rabies virus-neutralizing antibody (rVNA) titres following primary vaccination in dogs.</title>
  <desc>Schematic of population-level rVNA kinetics in primary-vaccinated dogs, showing the 0.5 IU/mL regulatory threshold, the 21-day administrative-validity gate and the 30-day mandatory serology sampling gate. Original diagram; not a reproduction of any published figure.</desc>

  <rect width="800" height="600" fill="#FFFFFF"></rect>

  
  <line x1="50" y1="60" x2="750" y2="60" stroke="#000000" stroke-width="1"></line>
  <text x="50" y="44" font-size="14" fill="#000000" font-weight="bold">Figure 1.</text>
  <text x="110" y="44" font-size="14" fill="#000000">Kinetics of rabies virus-neutralizing antibody (rVNA) titres after primary vaccination in dogs.</text>
  <text x="50" y="78" font-size="10" fill="#666666" font-style="italic">Schematic synthesis of population-level antibody response; the shaded band represents documented inter-individual variability.</text>

  
  
  <line x1="90" y1="470" x2="720" y2="470" stroke="#000000" stroke-width="1.2"></line>
  <line x1="90" y1="110" x2="90" y2="470" stroke="#000000" stroke-width="1.2"></line>

  
  <g font-size="10" fill="#000000">
    <line x1="86" y1="450" x2="90" y2="450" stroke="#000000"></line>
    <text x="80" y="453" text-anchor="end">0.1</text>
    <line x1="86" y1="380" x2="90" y2="380" stroke="#000000"></line>
    <text x="80" y="383" text-anchor="end">0.5</text>
    <line x1="86" y1="340" x2="90" y2="340" stroke="#000000"></line>
    <text x="80" y="343" text-anchor="end">1.0</text>
    <line x1="86" y1="280" x2="90" y2="280" stroke="#000000"></line>
    <text x="80" y="283" text-anchor="end">2.0</text>
    <line x1="86" y1="210" x2="90" y2="210" stroke="#000000"></line>
    <text x="80" y="213" text-anchor="end">5.0</text>
    <line x1="86" y1="150" x2="90" y2="150" stroke="#000000"></line>
    <text x="80" y="153" text-anchor="end">10.0</text>
  </g>
  <text x="30" y="290" font-size="11" fill="#000000" transform="rotate(-90 30 290)" text-anchor="middle">rVNA titre (IU/mL, log scale)</text>

  
  <g font-size="10" fill="#000000">
    
    <g stroke="#000000">
      <line x1="90" y1="470" x2="90" y2="474"></line>
      <line x1="160" y1="470" x2="160" y2="474"></line>
      <line x1="230" y1="470" x2="230" y2="474"></line>
      <line x1="300" y1="470" x2="300" y2="474"></line>
      <line x1="390" y1="470" x2="390" y2="474"></line>
      <line x1="540" y1="470" x2="540" y2="474"></line>
      <line x1="690" y1="470" x2="690" y2="474"></line>
    </g>
    <text x="90" y="488" text-anchor="middle">0</text>
    <text x="160" y="488" text-anchor="middle">7</text>
    <text x="230" y="488" text-anchor="middle">14</text>
    <text x="300" y="488" text-anchor="middle">21</text>
    <text x="390" y="488" text-anchor="middle">30</text>
    <text x="540" y="488" text-anchor="middle">45</text>
    <text x="690" y="488" text-anchor="middle">60</text>
  </g>
  <text x="405" y="510" font-size="11" fill="#000000" text-anchor="middle">Days post-primary vaccination</text>

  
  <line x1="90" y1="380" x2="720" y2="380" stroke="#666666" stroke-width="1" stroke-dasharray="4,3"></line>
  <text x="724" y="383" font-size="10" fill="#666666">0.5 IU/mL — WOAH protective threshold</text>

  
  
  <path d="M 90,470 C 160,468 200,440 230,360 C 260,300 300,240 390,200 C 480,180 600,170 690,168 L 690,260 C 600,270 480,290 390,310 C 300,330 260,360 230,420 C 200,450 160,468 90,470 Z" fill="#1A5276" fill-opacity="0.10" stroke="none"></path>

  
  <path d="M 90,470 C 160,468 200,455 230,400 C 260,355 300,290 390,255 C 480,235 600,225 690,222" fill="none" stroke="#1A5276" stroke-width="2.2"></path>

  
  
  <line x1="300" y1="110" x2="300" y2="470" stroke="#666666" stroke-width="1" stroke-dasharray="2,3"></line>
  
  <line x1="390" y1="110" x2="390" y2="470" stroke="#1A5276" stroke-width="1.4" stroke-dasharray="6,3"></line>

  
  <circle cx="300" cy="288" r="3.5" fill="#000000"></circle>
  <circle cx="390" cy="255" r="4.5" fill="#1A5276" stroke="#000000" stroke-width="0.8"></circle>

  
  <g font-size="10" fill="#000000">
    
    <line x1="300" y1="128" x2="240" y2="128" stroke="#000000" stroke-width="0.7"></line>
    <text x="236" y="120" text-anchor="end" font-weight="bold">Day 21</text>
    <text x="236" y="132" text-anchor="end">Administrative validity</text>
    <text x="236" y="144" text-anchor="end" fill="#666666" font-style="italic">EU Reg. 576/2013</text>

    
    <line x1="390" y1="128" x2="475" y2="128" stroke="#1A5276" stroke-width="0.8"></line>
    <text x="479" y="120" font-weight="bold" fill="#1A5276">Day ≥ 30 — Sampling window opens</text>
    <text x="479" y="132">Earliest legal RFFIT / FAVN draw</text>
    <text x="479" y="144" fill="#666666" font-style="italic">EU · CDC · UK · DAWR · AQS</text>

    
    <text x="520" y="320" fill="#1A5276" font-style="italic">Inter-individual variability</text>
    <text x="520" y="334" fill="#666666">(breed, age, vaccine, host status)</text>

    
    <text x="200" y="380" fill="#1A5276" font-weight="bold">Population mean rVNA</text>

    
    <text x="195" y="438" fill="#666666" font-style="italic">Seroconversion window (d 7–14)</text>
  </g>

  
  <g>
    <rect x="430" y="200" width="265" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="0.6"></rect>
    <text x="438" y="216" font-size="10" fill="#000000" font-weight="bold">Day 30–40 interval (Crozet et al., 2024)</text>
    <text x="438" y="230" font-size="10" fill="#000000">1,139 / 1,279 dogs ≥ 0.5 IU/mL (89.1 %)</text>
    <text x="438" y="240" font-size="9" fill="#666666" font-style="italic">pooled field cohort, RFFIT/FAVN reference labs</text>
  </g>

  
  <g transform="translate(90,535)" font-size="10" fill="#000000">
    <line x1="0" y1="-3" x2="22" y2="-3" stroke="#1A5276" stroke-width="2.2"></line>
    <text x="28" y="0">Population mean</text>
    <rect x="148" y="-9" width="22" height="10" fill="#1A5276" fill-opacity="0.10"></rect>
    <text x="176" y="0">Variability band</text>
    <line x1="290" y1="-3" x2="312" y2="-3" stroke="#666666" stroke-width="1" stroke-dasharray="4,3"></line>
    <text x="318" y="0">0.5 IU/mL threshold</text>
    <line x1="448" y1="-3" x2="470" y2="-3" stroke="#1A5276" stroke-width="1.4" stroke-dasharray="6,3"></line>
    <text x="476" y="0">Regulatory gate (d 30)</text>
  </g>

  
  <text x="50" y="568" font-size="9" fill="#666666" font-style="italic">Sources: Wallace et al., 2017 (PLoS NTD, n=8,011); Crozet et al., 2024 (Zoonoses Public Health); Kennedy et al., 2007; Berndtsson et al., 2011; Smith et al., 2021. Curve is schematic, not fitted.</text>

  
