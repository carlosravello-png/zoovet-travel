<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" font-family="Times New Roman, serif">
  <title>Figure 1. MPI New Zealand entry pathway — decision flowchart by country group.</title>
  <desc>Branching flowchart of the MPI New Zealand Import Health Standard for dogs and cats (IHS 154.02.06): country-group classification (Group 1 rabies-free / Group 2 approved / Group 3 rest-of-world including Peru), microchip-before-vaccine rule, RFFIT requirement, 6-month wait from sample date, treatments, AHC and mandatory quarantine.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"></path>
    </marker>
    <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1A5276"></path>
    </marker>
  </defs>

  <rect width="600" height="800" fill="#FFFFFF"></rect>

  
  <line x1="40" y1="60" x2="560" y2="60" stroke="#000000" stroke-width="1"></line>
  <text x="40" y="42" font-size="13" font-weight="bold" fill="#000000">Figure 1.</text>
  <text x="100" y="42" font-size="13" fill="#000000">MPI New Zealand — entry pathway by country group.</text>
  <text x="40" y="76" font-size="9.5" font-style="italic" fill="#666666">Adapted from MPI Import Health Standard IHS 154.02.06 (2024) and CATDOG.GEN. Verify the live IHS at mpi.govt.nz before each export.</text>

  
  <rect x="200" y="92" width="200" height="32" fill="#1A5276" stroke="#000000" stroke-width="1"></rect>
  <text x="300" y="113" font-size="12" text-anchor="middle" fill="#FFFFFF" font-weight="bold">DOG / CAT for entry to NZ</text>
  <line x1="300" y1="124" x2="300" y2="142" stroke="#000000" stroke-width="1.2" marker-end="url(#arr)"></line>

  
  <polygon points="300,148 425,200 300,252 175,200" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"></polygon>
  <text x="300" y="190" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">MPI country</text>
  <text x="300" y="204" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">group of origin?</text>
  <text x="300" y="220" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">(IHS 154.02.06)</text>

  
  
  <line x1="175" y1="200" x2="100" y2="200" stroke="#000000" stroke-width="1"></line>
  <line x1="100" y1="200" x2="100" y2="290" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="138" y="194" font-size="9.5" text-anchor="middle" fill="#000000" font-weight="bold">Group 1</text>
  <text x="138" y="208" font-size="8.5" text-anchor="middle" fill="#666666" font-style="italic">rabies-free</text>

  
  <line x1="300" y1="252" x2="300" y2="290" stroke="#1A5276" stroke-width="1.4" marker-end="url(#arrAcc)"></line>
  <text x="312" y="278" font-size="9.5" fill="#1A5276" font-weight="bold">Group 2</text>

  
  <line x1="425" y1="200" x2="500" y2="200" stroke="#000000" stroke-width="1"></line>
  <line x1="500" y1="200" x2="500" y2="290" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="462" y="194" font-size="9.5" text-anchor="middle" fill="#000000" font-weight="bold">Group 3</text>
  <text x="462" y="208" font-size="8.5" text-anchor="middle" fill="#666666" font-style="italic">incl. Peru</text>

  
  <rect x="55" y="290" width="90" height="74" fill="#FFFFFF" stroke="#000000" stroke-width="1"></rect>
  <text x="100" y="308" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">GROUP 1</text>
  <text x="100" y="322" font-size="9" text-anchor="middle" fill="#000000">Microchip</text>
  <text x="100" y="334" font-size="9" text-anchor="middle" fill="#000000">+ vaccination</text>
  <text x="100" y="346" font-size="9" text-anchor="middle" fill="#000000">+ AHC + treatments.</text>
  <text x="100" y="360" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">no RFFIT</text>

  
  <rect x="240" y="290" width="120" height="74" fill="#FFFFFF" stroke="#000000" stroke-width="1"></rect>
  <text x="300" y="308" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">GROUP 2</text>
  <text x="300" y="322" font-size="9" text-anchor="middle" fill="#000000">Microchip + vaccine</text>
  <text x="300" y="334" font-size="9" text-anchor="middle" fill="#000000">+ RFFIT ≥ 0.5 IU/mL</text>
  <text x="300" y="346" font-size="9" text-anchor="middle" fill="#000000">+ 3-month wait</text>
  <text x="300" y="358" font-size="9" text-anchor="middle" fill="#000000">+ AHC + treatments.</text>

  
  <rect x="455" y="290" width="90" height="74" fill="#1A5276" stroke="#000000" stroke-width="1.2"></rect>
  <text x="500" y="308" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="bold">GROUP 3</text>
  <text x="500" y="324" font-size="9" text-anchor="middle" fill="#FFFFFF">Full protocol</text>
  <text x="500" y="338" font-size="9" text-anchor="middle" fill="#FFFFFF">+ 6-month wait</text>
  <text x="500" y="352" font-size="9" text-anchor="middle" fill="#FFFFFF">from sample date</text>
  <text x="500" y="364" font-size="9" text-anchor="middle" fill="#FFFFFF" font-style="italic">(Peru route)</text>

  
  <line x1="100" y1="364" x2="100" y2="395" stroke="#000000" stroke-width="1"></line>
  <line x1="100" y1="395" x2="290" y2="395" stroke="#000000" stroke-width="1"></line>
  <line x1="300" y1="364" x2="300" y2="395" stroke="#000000" stroke-width="1"></line>
  <line x1="500" y1="364" x2="500" y2="395" stroke="#000000" stroke-width="1"></line>
  <line x1="500" y1="395" x2="310" y2="395" stroke="#000000" stroke-width="1"></line>
  <line x1="300" y1="395" x2="300" y2="415" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>

  
  <polygon points="300,420 410,465 300,510 190,465" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"></polygon>
  <text x="300" y="455" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">Microchip implanted</text>
  <text x="300" y="469" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">BEFORE RFFIT sample?</text>
  <text x="300" y="485" font-size="9" text-anchor="middle" fill="#1A5276" font-style="italic">(NZ-specific: stricter than EU/AU)</text>
  <line x1="410" y1="465" x2="478" y2="465" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="444" y="459" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">NO</text>
  <line x1="300" y1="510" x2="300" y2="535" stroke="#1A5276" stroke-width="1.4" marker-end="url(#arrAcc)"></line>
  <text x="312" y="528" font-size="10" fill="#1A5276" font-weight="bold">YES</text>

  
  <polygon points="300,540 420,590 300,640 180,590" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"></polygon>
  <text x="300" y="580" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">≥ 6 months elapsed</text>
  <text x="300" y="594" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">from RFFIT sample date?</text>
  <text x="300" y="610" font-size="9" text-anchor="middle" fill="#1A5276" font-style="italic">(not from result date)</text>
  <line x1="420" y1="590" x2="478" y2="590" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="450" y="584" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">NO</text>
  <line x1="300" y1="640" x2="300" y2="660" stroke="#1A5276" stroke-width="1.4"></line>

  
  <rect x="160" y="660" width="280" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"></rect>
  <text x="300" y="678" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">Export Health Certificate +</text>
  <text x="300" y="694" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">parasiticide treatments complete?</text>
  <line x1="440" y1="682" x2="478" y2="682" stroke="#000000" stroke-width="1" marker-end="url(#arr)"></line>
  <text x="458" y="676" font-size="9.5" text-anchor="middle" fill="#000000" font-weight="bold">NO</text>
  <line x1="300" y1="704" x2="300" y2="725" stroke="#1A5276" stroke-width="1.6" marker-end="url(#arrAcc)"></line>
  <text x="312" y="720" font-size="10" fill="#1A5276" font-weight="bold">YES</text>

  
  <rect x="120" y="730" width="360" height="38" fill="#1A5276" stroke="#000000" stroke-width="1"></rect>
  <text x="300" y="747" font-size="12" text-anchor="middle" fill="#FFFFFF" font-weight="bold">ARRIVAL → 10-DAY MPI QUARANTINE</text>
  <text x="300" y="761" font-size="9.5" text-anchor="middle" fill="#FFFFFF" font-style="italic">Auckland — accredited facility — owner&#39;s expense</text>

  
  <rect x="478" y="170" width="100" height="495" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"></rect>
  <text x="528" y="192" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">ENTRY DENIED</text>
  <line x1="488" y1="200" x2="568" y2="200" stroke="#000000" stroke-width="0.6"></line>
  <text x="528" y="220" font-size="9" text-anchor="middle" fill="#000000">Animal returned</text>
  <text x="528" y="232" font-size="9" text-anchor="middle" fill="#000000">to country of</text>
  <text x="528" y="244" font-size="9" text-anchor="middle" fill="#000000">origin or held</text>
  <text x="528" y="256" font-size="9" text-anchor="middle" fill="#000000">at owner cost.</text>
  <text x="528" y="280" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">Triggers:</text>
  <text x="528" y="300" font-size="9" text-anchor="middle" fill="#000000">• Microchip after</text>
  <text x="528" y="312" font-size="9" text-anchor="middle" fill="#000000">  RFFIT sample</text>
  <text x="528" y="332" font-size="9" text-anchor="middle" fill="#000000">• &lt; 6 mo from</text>
  <text x="528" y="344" font-size="9" text-anchor="middle" fill="#000000">  sample date</text>
  <text x="528" y="364" font-size="9" text-anchor="middle" fill="#000000">• Missing AHC</text>
  <text x="528" y="376" font-size="9" text-anchor="middle" fill="#000000">  or treatments</text>
  <text x="528" y="396" font-size="9" text-anchor="middle" fill="#000000">• Document /</text>
  <text x="528" y="408" font-size="9" text-anchor="middle" fill="#000000">  chip mismatch</text>
  <text x="528" y="432" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">Restart from</text>
  <text x="528" y="444" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">failed step</text>
  <text x="528" y="456" font-size="9" text-anchor="middle" fill="#666666" font-style="italic">(weeks–months).</text>

  
  <text x="560" y="788" font-size="8" fill="#666666" text-anchor="end">© Jessica Y. Camacho Garcia, MVZ — CMVP 12434 | Zoovet Travel — Technical Series Vol. XV | zoovettravel.com | 2026</text>
</svg>