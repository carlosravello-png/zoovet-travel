<title>Kinetics of rabies virus-neutralizing antibodies (rVNA) following primary vaccination in dogs</title>
<desc>Descriptive synthesis of published literature showing IgM, IgG and total rVNA kinetics versus the 0.5 IU/mL regulatory threshold. Authors: Camacho García JY, Camacho Paz VJ. Source: zoovettravel.com</desc>
